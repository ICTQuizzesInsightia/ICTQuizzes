<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one bright "desktop" screen with a taskbar-style header; big tappable tiles in the four Windows-logo colors. Single bright theme by choice (made for 6-year-olds). */
:root{
  --sky:#DDF0FF; --sky2:#BFE2FF; --ink:#16305A; --paper:#FFFFFF;
  --red:#F2562B; --green:#4DB131; --blue:#1C83E0; --yellow:#FFC21A; --purple:#8C5BE0;
  --soft:#5A7397;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sky);background-image:radial-gradient(circle at 15% 10%,#fff 0,transparent 35%),linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.homebtn{display:flex;align-items:center;gap:8px;background:transparent;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;padding:4px 6px;border-radius:12px}
.homebtn svg{width:34px;height:34px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:#ffffff1f;border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:20px}
.pill b{color:var(--yellow);font-size:22px}
.toggle{background:#ffffff1f;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:16px}
.toggle[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,7vw,56px);font-weight:800}
h2{font-size:clamp(26px,5vw,38px);font-weight:800}
h3{font-size:24px;font-weight:800}
.ar{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;direction:rtl;color:var(--soft);font-size:18px;display:none}
body.arabic .ar{display:block}
/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:22px}
.hero p{margin:6px 0 0;font-size:20px;max-width:34ch}
.bee{width:110px;height:110px}
.section-label{font-family:var(--display);font-weight:800;font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.section-label .num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--paper);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #16305a22;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(2px)}
.tile .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff}
.tile .ico svg{width:42px;height:42px}
.tile .t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.tile .s{color:var(--soft);font-size:15px}
.stars{display:flex;gap:2px;font-size:22px;line-height:1}
.stars i{font-style:normal;color:#d5dce8}
.stars i.on{color:var(--yellow);text-shadow:0 1px 0 #c98f00}
.c-red{background:var(--red)}.c-green{background:var(--green)}.c-blue{background:var(--blue)}.c-yellow{background:var(--yellow);color:var(--ink)!important}.c-purple{background:var(--purple)}.c-ink{background:var(--ink)}
.reset{margin-top:30px;background:transparent;color:var(--soft);text-decoration:underline;font-size:15px}
/* shared view chrome */
.viewhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.viewhead h2{flex:1;min-width:0}
.bookbtn{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:17px;border-radius:999px;padding:9px 16px;box-shadow:0 4px 0 #c98f00}
.bookbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c98f00}
.bookbtn svg{width:24px;height:24px}
.card{background:var(--paper);border-radius:28px;padding:22px;box-shadow:0 8px 0 #16305a1f}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;flex:none}
.say svg{width:24px;height:24px}
.big{font-size:22px}
.prompt{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,32px);margin-bottom:14px}
.btn{background:var(--green);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;border-radius:18px;padding:12px 22px;box-shadow:0 5px 0 #2f7a1b}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2f7a1b}
.btn.alt{background:var(--blue);box-shadow:0 5px 0 #0f5aa3}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.progress{display:flex;gap:8px;margin:0 0 14px}
.progress span{flex:1;height:12px;border-radius:99px;background:#16305a1a}
.progress span.done{background:var(--green)}
.progress span.now{background:var(--yellow)}
/* learn */
.learn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
.learn .pic{background:var(--sky);border-radius:22px;padding:14px;display:grid;place-items:center;min-height:220px}
.learn .pic svg{width:100%;max-width:300px;height:auto}
.learn .pic img{border-radius:12px;width:100%}
.learn .pic .row svg{width:110px;max-width:42%}
.word{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.word h3{font-size:clamp(30px,6vw,42px);color:var(--blue)}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.facts li{display:flex;gap:10px;align-items:flex-start;font-size:21px}
.facts li::before{content:"";flex:none;width:14px;height:14px;margin-top:9px;border-radius:4px;background:var(--c,var(--green))}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{background:var(--sky);border-radius:14px;padding:6px 12px;font-weight:700;font-size:17px}
.arrow{color:var(--soft);font-weight:700}
.warn{background:#FFE4DA;color:#9a2a0b;border-radius:16px;padding:10px 14px;font-weight:700;margin-top:12px;font-size:18px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;background:#16305a26;padding:0}
.dots button.on{background:var(--blue);transform:scale(1.25)}
.dots button.seen{background:var(--green)}
/* tap game */
.deskwrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #16305a33;touch-action:manipulation}
.deskwrap img{display:block;width:100%}
.ping{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:6px solid var(--yellow);pointer-events:none;animation:ping .6s ease-out forwards}
.ping.bad{border-color:var(--red)}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.zone{position:absolute;border:5px solid var(--yellow);border-radius:12px;background:#ffc21a33;pointer-events:none;animation:pop .4s}
/* order game */
.train{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.slot{min-height:120px;border:4px dashed #16305a33;border-radius:20px;display:grid;place-items:center;text-align:center;padding:8px;font-family:var(--display);font-weight:800;color:#16305a55;font-size:28px}
.slot.filled{border:4px solid var(--green);background:#e7f8df;color:var(--ink);font-size:17px;animation:pop .35s}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stepcard{background:var(--paper);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #16305a26;font-weight:700;font-size:17px;text-align:center;line-height:1.2}
.stepcard svg,.slot svg{width:54px;height:54px}
.stepcard.used{visibility:hidden}
/* choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.choice{background:var(--paper);border:4px solid #16305a1a;border-radius:20px;padding:14px 10px;font-weight:700;font-size:21px;display:flex;flex-direction:column;align-items:center;gap:6px}
.choice svg{width:48px;height:48px}
.choice.right{border-color:var(--green);background:#e7f8df;animation:pop .35s}
.choice.wrong{border-color:var(--red);background:#ffe4da;animation:shake .4s}
.sentence{font-size:clamp(22px,4.5vw,28px);line-height:1.5;font-weight:700}
.blank{display:inline-block;min-width:120px;border-bottom:4px solid var(--blue);color:var(--blue);text-align:center;padding:0 6px}
/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
.col{display:grid;gap:10px;align-content:start}
.m{background:var(--paper);border:4px solid #16305a1a;border-radius:18px;padding:10px 12px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;text-align:left;min-height:66px;line-height:1.2}
.m svg{width:38px;height:38px;flex:none}
.m.sel{border-color:var(--blue);background:#e3f1ff}
.m.ok{border-color:var(--green);background:#e7f8df;opacity:.75}
.m.wrong{animation:shake .4s;border-color:var(--red)}
/* safe game */
.safebtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.safe{border-radius:24px;padding:18px;font-family:var(--display);font-weight:800;font-size:26px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}

/* ---------- sound + voice ---------- */
let AC;
function tone(seq){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d); t+=d*.8; });
  } catch(e) {}
}
const yay = ()=>tone([[660,.12],[880,.12],[1175,.22]]);
const oops = ()=>tone([[300,.15],[220,.25]]);
function say(text){
  if (!S.sound) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.8; u.pitch=1.1; speechSynthesis.speak(u); } catch(e) {}
}
const sayBtn = t => `<button class="say" data-say="${t.replace(/"/g,'&quot;')}" aria-label="Listen">${SV.speaker}</button>`;
document.addEventListener('click', e=>{ const b=e.target.closest('[data-say]'); if (b){ e.stopPropagation(); say(b.dataset.say); } }, true);

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1100); }
const PRAISE = ['Great job!','Super!','Well done!','You got it!','Amazing!','Yes!'];
const praise = ()=>{ const p=PRAISE[Math.floor(Math.random()*PRAISE.length)]; toast(p+' ★'); yay(); say(p); };

/* confetti */
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#F2562B','#4DB131','#1C83E0','#FFC21A','#8C5BE0'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:5+Math.random()*6,vy:2+Math.random()*4,vx:-2+Math.random()*4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let n=0; (function f(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();}); if(++n<160) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

function openBook(pages){

  const draw=()=>{ m.innerHTML=`<div class="win" role="dialog" aria-label="Book page">
    <div class="wintitle"><span>My Book · Page ${pages[i]}</span><button class="winx" aria-label="Close">✕</button></div>

function finish(id, mistakes, again, next){
  const stars = mistakes===0?3:mistakes<=2?2:1;
  S.best[id] = Math.max(S.best[id]||0, stars); save();
  confetti(); tone([[523,.12],[659,.12],[784,.12],[1047,.3]]); say(stars===3?'Perfect! Three stars!':'Well done!');
  app.innerHTML = `<div class="card done">
    ${SV.bee.replace('<svg','<svg width="120" height="120"')}
    <h2>${stars===3?'Perfect!':'Well done!'}</h2>
    <div class="stars">${[1,2,3].map(k=>`<i class="${k<=stars?'on':''}">★</i>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn alt" id="again">Play again</button>${curTopic!==null?`<button class="btn alt" id="lesson">Back to the lesson</button>`:''}${curTopic!==null&&curTopic<TOPICS.length-1?`<button class="btn" id="nextT">Next topic ›</button>`:''}</div>
  </div>`;
  app.querySelector('#again').onclick=again;

  const nt=app.querySelector('#nextT'); if(nt) nt.onclick=()=>viewTopic(curTopic+1);
}

const ZONES = {  /* % boxes on desk.jpg */
  'Computer':[[0,0,9,11]], 'Recycle Bin':[[0,48,9,61]], 'Start button':[[0,92,6,100]],
  'Taskbar':[[6,92,100,100]], 'Icons':[[0,0,9,61]], 'Desktop':[[12,8,95,88]]
};
const TAP_AR = {'Computer':'الكمبيوتر','Recycle Bin':'سلة المحذوفات','Start button':'زر ابدأ','Taskbar':'شريط المهام','Icons':'الأيقونات','Desktop':'سطح المكتب'};
function gameTap(){
  const order = shuffle(Object.keys(ZONES)); let i=0, miss=0;
  function round(){
    if (i>=order.length) return finish('tap',miss,gameTap);
    const w=order[i];
    app.innerHTML = `<div class="viewhead">${backBtn()}<h2>Tap it!</h2>${bookBtn([19,26])}</div>${bar(order.length,i)}
      <div class="card"><div class="prompt">Tap the ${w==='Icons'?'icons':w} ${sayBtn('Tap the '+w)}</div><div class="ar">اضغط على: ${TAP_AR[w]}</div>
      <div class="deskwrap" id="desk"><img src="${__IMG['desk.jpg']}" alt="Windows desktop picture"></div></div>`;
    say('Tap the '+w);
    const d=app.querySelector('#desk');
    d.onclick=e=>{
      const r=d.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
      let hit = ZONES[w].some(([a,b,c,dd])=>x>=a&&x<=c&&y>=b&&y<=dd);
      if (w==='Desktop' && hit) hit = !(x<9 && y<61);
      const p=document.createElement('div'); p.className='ping'+(hit?'':' bad'); p.style.left=x+'%'; p.style.top=y+'%'; d.appendChild(p); setTimeout(()=>p.remove(),600);
      if (hit){
        const [a,b,c,dd]=ZONES[w][0]; const z=document.createElement('div'); z.className='zone'; Object.assign(z.style,{left:a+'%',top:b+'%',width:(c-a)+'%',height:(dd-b)+'%'}); d.appendChild(z);
        d.onclick=null; praise(); setTimeout(()=>{i++;round();},1300);
      } else { miss++; oops(); if (miss%2===0){ const [a,b,c,dd]=ZONES[w][0]; const z=document.createElement('div'); z.className='zone'; z.style.borderColor='var(--purple)'; Object.assign(z.style,{left:a+'%',top:b+'%',width:(c-a)+'%',height:(dd-b)+'%'}); d.appendChild(z); setTimeout(()=>z.remove(),1200); } }
    };
  }
  round();
}

/* keep the instruction box one height for the whole game, so taps never land on a moved screen */
function lockPromptHeight(){
  const mt=app.querySelector('.mtext'), b=app.querySelector('#mtxt'), tp=app.querySelector('#mtip'); if(!mt||!b||!M) return;
  const keep=b.textContent, keepTip=tp?tp.textContent:''; mt.style.minHeight='0px';
  const texts=[...M.steps.map(s=>s[1]), M.end||'', 'Wait… watch the screen.', 'Wait… Windows is starting.', promptText()];
  if (tp) tp.textContent='Good! Now click two times, fast!';
  let mx=0; texts.forEach(t=>{ b.textContent=t; mx=Math.max(mx, mt.offsetHeight); });
  b.textContent=keep; if (tp) tp.textContent=keepTip; mt.style.minHeight=mx+'px';
}
let lockT=null; window.addEventListener('resize',()=>{ clearTimeout(lockT); lockT=setTimeout(lockPromptHeight,150); });
function startMission(key){
  const D = MISSIONS[key];
  M = {key, ...D, i:0, miss:0, hint:false};
  resetSim(D.start, D.wins);
  app.innerHTML = `<div class="viewhead">${backBtn()}<h2>${D.title}</h2>${bookBtn(D.page)}</div>
    <div class="mbar">${SV.bee.replace('<svg','<svg class="beeS"')}<div class="mtext"><b id="mtxt"></b><div class="mtip" id="mtip"></div><div class="ar" id="mar"></div></div>
    <button class="say" id="msay" aria-label="Listen">${SV.speaker}</button>${D.free?'':'<button class="helpbtn" id="mhelp">Help me</button>'}</div>
    <div class="chips" id="chips"></div>
    <div class="simbox" id="simbox"></div>
    <div class="simtools"><button class="viewbtn" id="vHw">Look at the computer</button><button class="viewbtn" id="vDesk">Look at the screen</button></div>`;
  app.querySelector('#msay').onclick=()=>say(promptText());
  const h=app.querySelector('#mhelp'); if(h) h.onclick=()=>{ M.hint=true; renderSim(); say(promptText()); };
  app.querySelector('#vHw').onclick=()=>{ SIM.view='hw'; renderSim(); };
  app.querySelector('#vDesk').onclick=()=>{ if(!(SIM.mon&&SIM.cpu)){ tip('The screen is off.'); return; } SIM.view='desk'; renderSim(); };
  const box=app.querySelector('#simbox');
  box.addEventListener('click', onSimClick);
  new ResizeObserver(()=>box.style.setProperty('--s', box.clientWidth/720)).observe(box);
  stepStart(); lockPromptHeight(); scrollTo(0,0);
}
const STEP_AR = {'power':'اضغط زر الطاقة','cpu':'اضغط زر وحدة المعالجة CPU','monitor':'اضغط زر الشاشة','start':'اضغط زر ابدأ','allprog':'اضغط كل البرامج','acc':'اضغط البرامج الملحقة','app-calc':'اضغط الآلة الحاسبة','app-paint':'اضغط الرسام','dbl-comp':'انقر مرتين بسرعة على الكمبيوتر','x-calc':'اضغط X للإغلاق','x-paint':'اضغط X للإغلاق','x-comp':'اضغط X للإغلاق','shut':'اضغط إيقاف التشغيل'};
function promptText(){
  if (M.free) return 'Play with the computer! Switch it on, open programs, then shut it down.';
  return M.steps[M.i] ? M.steps[M.i][1] : (M.end||'Well done!');
}
function stepStart(){
  M.hint=false; clearTimeout(idleT);
  if (!M.free && M.steps[M.i]) idleT=setTimeout(()=>{ if(M){ M.hint=true; renderSim(); } }, 6000);
  const t=app.querySelector('#mtxt'); if(!t) return;
  t.textContent=promptText(); app.querySelector('#mtip').textContent='';
  const exp=expected(); app.querySelector('#mar').textContent = exp? (STEP_AR[exp]||'') : 'شغّل الكمبيوتر، افتح البرامج، ثم أطفئه';
  app.querySelector('#chips').innerHTML = M.free ? '' : M.steps.map((s,k)=>`${k?'<span class="arrow">➜</span>':''}<span class="chip ${k<M.i?'done':k===M.i?'now':''}">${k+1}. ${s[2]}</span>`).join('');
  say(promptText()); renderSim();
}
function tip(msg){ const el=app.querySelector('#mtip'); if(el) el.textContent=msg; say(msg); }

/* click routing inside the simulation */
function onSimClick(e){
  const ck=e.target.closest('[data-calc]'); if (ck){ calcKey(ck.dataset.calc); return; }
  const pc=e.target.closest('[data-pc]'); if (pc){ paintColor=pc.dataset.pc; app.querySelectorAll('[data-pc]').forEach(b=>b.classList.toggle('on',b===pc)); return; }
  const el=e.target.closest('[data-act]'); if (!el) return;
  let id=el.dataset.act;
  if (id==='icon-comp'){ const now=Date.now(); id = (now-lastIconClick<650) ? 'dbl-comp' : 'sel-comp'; lastIconClick = id==='dbl-comp'?0:now; }
  act(id, el);
}
function act(id, el){
  if (busy) return;
  const exp = expected();
  if (id==='desk'){ if (M.free && (SIM.menu||SIM.sel)){ SIM.menu=null; SIM.sel=null; renderSim(); } return; }
  if (id==='sel-comp'){ SIM.sel='comp'; renderSim(); if (exp==='dbl-comp') tip('Good! Now click two times, fast!'); return; }
  if (exp && id!==exp){ return mistake(id, el); }
  const ok = effect(id);
  if (ok===false){ if (exp) M.miss++; renderSim(); return; }
  if (exp===id){ M.i++; tone([[620+M.i*90,.12]]); if (M.i>=M.steps.length) return missionDone(); stepStart(); return; }
  renderSim();
}
const HW = ['power','cpu','monitor'];
function mistake(id, el){
  M.miss++; M.hint=true; oops();
  const exp=expected(), label=M.steps[M.i][2];
  let msg = 'Oops! Not this one. '+M.steps[M.i][1];
  if (HW.includes(id) && HW.includes(exp)) msg = 'Not yet! First: '+label+'.';
  if (id==='power' && SIM.cpu) msg = 'Never switch off from the power button! Use Start, then Shut down.';
  if (id==='cpu' && SIM.cpu) msg = 'Never switch off from the CPU button! Use Start, then Shut down.';
  if (id==='shut' && SIM.wins.length) msg = 'First close all windows. Click X.';
  tip(msg); renderSim();
  const again = el && app.querySelector(`[data-act="${el.dataset.act}"]`);
  if (again && again.animate) again.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:350});
}
function missionDone(){
  clearTimeout(idleT); renderSim();
  app.querySelector('#chips').querySelectorAll('.chip').forEach(c=>c.className='chip done');
  if (M.key==='on' && SIM.os!=='desktop'){ M.waitBoot=true; app.querySelector('#mtxt').textContent='Wait… Windows is starting.'; return; }
  wrapUp();
}
function wrapUp(){
  const m=M; praise();
  setTimeout(()=>{ if(m.end){ app.querySelector('#mtxt').textContent=m.end; say(m.end); } }, 900);
  setTimeout(()=>{ if (M!==m) return; finish('sim-'+m.key, m.miss, ()=>startMission(m.key)); M=null; }, m.end?3800:2200);
}

/* what each press does — following the book's rules */
function effect(id){
  const s=SIM;
  switch(id){
    case 'power':
      if (!s.power){ s.power=true; return; }
      if (s.cpu){ tip('Never switch off from the power button! Use Start, then Shut down.'); oops(); return false; }
      if (s.mon){ tip('First switch off the monitor.'); oops(); return false; }
      s.power=false; return;
    case 'cpu':
      if (!s.power){ tip('No electricity! Press the power button first.'); oops(); return false; }
      if (s.cpu){ tip('Never switch off from the CPU button! Use Start, then Shut down.'); oops(); return false; }
      s.cpu=true; s.os='booting';
      bootT=setTimeout(()=>{ s.os='desktop'; renderSim(); afterBoot(); }, 3200); return;
    case 'monitor':
      if (!s.power){ tip('No electricity! Press the power button first.'); oops(); return false; }
      s.mon=!s.mon; if (s.mon && s.os==='desktop') afterBoot(); return;
    case 'start': s.menu = s.menu ? null : 'start'; s.acc=false; return;
    case 'allprog': s.menu='all'; return;
    case 'back': s.menu='start'; s.acc=false; return;
    case 'acc': s.acc=!s.acc; return;
    case 'app-calc': case 'app-paint': case 'app-note': openWin(id.slice(4)); return;
    case 'dbl-comp': s.sel=null; openWin('comp'); return;
    case 'x-calc': case 'x-paint': case 'x-comp': case 'x-note': s.wins=s.wins.filter(w=>w!==id.slice(2)); return;
    case 'shut':
      if (s.wins.length){ tip('First close all windows. Click X.'); oops(); return false; }
      s.menu=null; s.os='shutting'; busy=true;
      setTimeout(()=>{ s.os='off'; s.cpu=false; s.view='hw'; busy=false; renderSim(); if(M&&M.free) tip('Now switch off the monitor, then the power button.'); }, 2600); return;
    default: return; /* other menu items do nothing in this game */
  }
}
function openWin(w){ SIM.menu=null; SIM.acc=false; if(!SIM.wins.includes(w)) SIM.wins.push(w); if(w==='calc') calc={cur:'0',acc:null,op:null,fresh:true}; }
function afterBoot(){
  if (!(SIM.mon && SIM.cpu && SIM.os==='desktop')) return;
  setTimeout(()=>{ if(!M) return; SIM.view='desk'; renderSim(); if (M.waitBoot){ M.waitBoot=false; wrapUp(); } else if (M.free) tip('Windows is ready! Click the Start button.'); }, 1100);
}

/* calculator that really works */
function calcKey(k){
  const c=calc, num=v=>parseFloat(v);
  const run=()=>{ const a=c.acc, b=num(c.cur); let r=b; if(c.op==='+')r=a+b; if(c.op==='-')r=a-b; if(c.op==='×')r=a*b; if(c.op==='÷')r=b===0?0:a/b; return Math.round(r*1e8)/1e8; };
  if (/\d/.test(k)){ c.cur = (c.fresh||c.cur==='0') ? k : (c.cur.length<12?c.cur+k:c.cur); c.fresh=false; }
  else if (k==='C'){ calc={cur:'0',acc:null,op:null,fresh:true}; }
  else if (k==='='){ if(c.op!==null){ c.cur=String(run()); c.op=null; c.acc=null; c.fresh=true; } }
  else { if(c.op!==null && !c.fresh) c.cur=String(run()); c.acc=num(c.cur); c.op=k; c.fresh=true; }
  tone([[500+Math.random()*200,.05]]); say(k==='×'?'times':k==='÷'?'divide':k==='C'?'clear':k==='='?'equals '+calc.cur:k);
  const d=app.querySelector('#cdisp'); if(d) d.textContent=calc.cur;
}
function getPaint(){
  if (paintCanvas) return paintCanvas;
  const c=document.createElement('canvas'); c.width=480; c.height=280; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,480,280); x.lineCap='round'; x.lineJoin='round';
  let down=false, lx=0, ly=0;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener('pointerdown',e=>{ down=true; [lx,ly]=pos(e); c.setPointerCapture(e.pointerId); x.fillStyle=paintColor; x.beginPath(); x.arc(lx,ly,4,0,7); x.fill(); });
  c.addEventListener('pointermove',e=>{ if(!down) return; const [nx,ny]=pos(e); x.strokeStyle=paintColor; x.lineWidth=paintColor==='#FFFFFF'?22:8; x.beginPath(); x.moveTo(lx,ly); x.lineTo(nx,ny); x.stroke(); lx=nx; ly=ny; });
  c.addEventListener('pointerup',()=>down=false); c.addEventListener('pointercancel',()=>down=false);
  return paintCanvas=c;
}

  const s=SIM, I=(act,ico,t,cls='')=>`<button class="smi ${cls}" data-act="${act}">${ico}<span>${t}</span></button>`;
  const fold=SV.folder;
  let list;
  if (s.menu==='start') list = I('noop',SV.icons,'Getting Started')+I('noop',SV.windows,'Windows Media Center')+I('noop',winIco.note,'Sticky Notes')+I('noop',SV.desktop,'Snipping Tool')+I('noop',SV.computer,'Remote Desktop')+`<div style="flex:1"></div><div class="smsep"></div>`+I('allprog',`<svg viewBox="0 0 60 60"><path d="M22 14l20 16-20 16z" fill="#16305A"/></svg>`,'All Programs','big');
  else list = I('noop',SV.windows,'Default Programs')+I('noop',SV.desktop,'Windows DVD Maker')+I('noop',SV.monitor,'Windows Media Player')

function renderSim(){
  const box=app.querySelector('#simbox'); if(!box) return;
  const showDesk = SIM.view==='desk' && SIM.power && SIM.cpu && SIM.mon && SIM.os!=='off';
  if (!showDesk) SIM.view='hw';
  const keepNote = app.querySelector('#npad') ? app.querySelector('#npad').value : null;
  box.innerHTML = showDesk ? deskHTML() : hwSVG();
  box.style.setProperty('--s', box.clientWidth/720);
  const slot=box.querySelector('.paintSlot'); if (slot) slot.appendChild(getPaint());
  if (keepNote!==null && box.querySelector('#npad')) box.querySelector('#npad').value=keepNote;
  const exp=expected();
  if (M && M.hint && exp) box.querySelectorAll(`[data-act="${exp}"],[data-hint="${exp}"]`).forEach(el=>{ if(!el.closest('svg')||el.tagName!=='g') el.classList.add('hint'); });
  const vh=app.querySelector('#vHw'), vd=app.querySelector('#vDesk');
  if (vh){ vh.hidden = !showDesk; vd.hidden = showDesk || !(SIM.power&&SIM.cpu&&SIM.mon&&SIM.os!=='off'); }
}

function gameSafe(){

function bookViewer(pages){
  let i=0;
  const html = `<div class="viewer" id="viewer">
    <div class="vimg"><img id="vimg" src="${pageImg(pages[0])}" alt="Book page ${pages[0]}"></div>
    <div class="vbar"><button class="vnav" id="vprev" aria-label="Previous page">‹</button><span id="vlab"></span><button class="vnav" id="vnext" aria-label="Next page">›</button><button class="vzoom" id="vzoom">Make it big</button></div></div>`;
  const wire = () => {
    const img=app.querySelector('#vimg'), lab=app.querySelector('#vlab');
    const draw=()=>{ img.src=pageImg(pages[i]); img.alt='Book page '+pages[i]; lab.textContent=`Page ${pages[i]}`+(pages.length>1?`  (${i+1} of ${pages.length})`:''); app.querySelector('#vprev').disabled=i===0; app.querySelector('#vnext').disabled=i===pages.length-1; };
    app.querySelector('#vprev').onclick=()=>{ if(i>0){i--;draw();} };
    app.querySelector('#vnext').onclick=()=>{ if(i<pages.length-1){i++;draw();} };
    app.querySelector('#vzoom').onclick=()=>openBook(pages.slice(i).concat(pages.slice(0,i)));
    draw();
  };
  return {html, wire};
}

function viewTopic(t){
  curTopic=t; const T=TOPICS[t]; S.learned[t]=1; save();
  const v=bookViewer(T.pages);
  const gameTiles = T.games.map(g=>{ const G=GAMEDEF[g]; return `<button class="tile" data-play="${g}"><span class="ico ${G.c}">${G.ico}</span><span class="t">${G.t}</span><span class="s">${G.s}</span>${starRow(S.best[scoreId(g)]||0)}</button>`; }).join('');
  app.innerHTML = `
  <div class="topichead">
    <span class="tnum ${T.color}">${t+1}</span>
    <div class="ttext"><span class="eyebrow">Topic ${t+1} of ${TOPICS.length}</span><h2>${T.title}</h2></div>
    ${sayBtn(T.title)}
  </div>
  <div class="tdots">${TOPICS.map((x,k)=>`<button class="${k===t?'on':S.learned[k]?'seen':''}" data-t="${k}" aria-label="${x.title}"><span>${k+1}</span></button>`).join('')}</div>

  <section class="part"><div class="partlabel"><span class="pn">A</span>Read the book</div>${v.html}</section>

  <section class="part"><div class="partlabel"><span class="pn">B</span>What the book says <button class="listenall" id="all">${SV.speaker} Listen to all</button></div>
    <div class="summary">${T.items.map((it,k)=>`<div class="sitem" data-i="${k}">
      <div class="spic">${it.pic}</div>
      <div class="stext"><p>${md(it.en)}</p>
        ${it.steps?`<div class="ssteps">${it.steps.map((s,j)=>`${j?'<span class="arrow">➜</span>':''}<span class="sstep">${s[1]}<span>${s[0]}</span></span>`).join('')}</div>`:''}
        <div class="ar">${it.ar}</div><span class="src">From the book · ${it.src}</span></div>
      ${sayBtn(itemVoice(it))}
    </div>`).join('')}</div>
  </section>

  <section class="part"><div class="partlabel"><span class="pn">C</span>Play</div><div class="tiles">${gameTiles}</div></section>

  <div class="navrow">
    ${t>0?`<button class="btn alt" id="tprev">‹ ${TOPICS[t-1].title}</button>`:'<span></span>'}
    ${t<TOPICS.length-1?`<button class="btn" id="tnext">${TOPICS[t+1].title} ›</button>`:`<button class="btn" id="tdone">Finish ★</button>`}
  </div>`;
  v.wire();
  say(T.title);
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>viewTopic(+b.dataset.t));
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{ tone([[880,.08]]); GAMEDEF[b.dataset.play].go(); scrollTo(0,0); });
  app.querySelector('#all').onclick=()=>{
    const list=T.items; let k=0; if(!S.sound) return;
    try{ speechSynthesis.cancel(); }catch(e){}
    const next=()=>{ app.querySelectorAll('.sitem').forEach(x=>x.classList.toggle('reading', +x.dataset.i===k)); if(k>=list.length) return;
      try{ const u=new SpeechSynthesisUtterance(itemVoice(list[k])); u.lang='en-US'; u.rate=.8; u.onend=()=>{k++;next();}; speechSynthesis.speak(u);}catch(e){} };
    next();
  };
  const p=app.querySelector('#tprev'); if(p) p.onclick=()=>viewTopic(t-1);
  const n=app.querySelector('#tnext'); if(n) n.onclick=()=>{ tone([[880,.08]]); viewTopic(t+1); };
  const d=app.querySelector('#tdone'); if(d) d.onclick=()=>{ confetti(); yay(); say('You finished the chapter! Great job!'); viewHome(); };
  scrollTo(0,0);
}

/* ---------- HOME ---------- */
const starRow = n => `<div class="stars">${[1,2,3].map(k=>`<i class="${k<=n?'on':''}">★</i>`).join('')}</div>`;
function viewHome(){
  curTopic=null; M=null; clearTimeout(idleT);

  <section class="hero">${SV.bee.replace('<svg','<svg class="bee"')}<div><h1>Let's learn Windows!</h1><p>Read the book, learn, then play. Win stars in every topic! ${sayBtn("Let's learn Windows! Read the book, learn, then play. Win stars in every topic!")}</p><div class="ar">اقرأ الكتاب، تعلّم، ثم العب واجمع النجوم في كل درس!</div></div></section>

  <button class="reset" id="reset">Start again (clear my stars)</button>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tone([[880,.08]]); viewTopic(+b.dataset.t); });
  app.querySelector('[data-free]').onclick=()=>startMission('free');

    if (r.dataset.sure){ S.learned={}; S.best={}; save(); viewHome(); } else { r.dataset.sure=1; r.textContent='Tap again to clear all stars'; }

}

     q:{en:'Bee clicked the icon 1 time. Nothing opened! What now?', ar:'النحلة ضغطت مرة واحدة ولم يفتح شيء! ماذا تفعل؟', choices:[C('Click 2 times fast',SV.dbl,1),C('Click 1 time again',SV.one)], why:'Click the left mouse button twice very quickly. This is double-clicking.'}},

  ],
  [ /* 5 Shutting down: pages 22, 23, 24 */

     q:{en:'Bee wants to switch off, but Paint is still open! What first?', ar:'النحلة تريد الإيقاف لكن الرسام ما زال مفتوحاً! ماذا أولاً؟', choices:[C('Close all windows',SV.closeApps,1),C('Open Calculator',SV.calc)], why:'Before shutting down, close all the applications and windows.'}},
    {page:24, pic:SV.shut, en:'To switch off:', steps:[['Start',SV.start],['Shut down',SV.shut],['Monitor off',SV.monitorOff],['Power button off',SV.plug]], ar:'للإيقاف: ابدأ ← إيقاف التشغيل ← أطفئ الشاشة ← أطفئ زر الطاقة',
     q:{order:1, en:'Help Bee switch off! Tap in the right order.', ar:'ساعد النحلة على الإيقاف! اضغط بالترتيب.', choices:[C('Start',SV.start),C('Shut down',SV.shut),C('Monitor off',SV.monitorOff),C('Power button off',SV.plug)], why:'Click Start, then Shut down. Then switch off the monitor and the power button.'}},
    {page:23, pic:SV.boom, en:'**Never** switch off from the power button or the CPU.', ar:'لا تُطفئ الكمبيوتر أبداً من زر الطاقة أو من وحدة المعالجة.',
     q:{en:'Bee is in a hurry and wants to press the CPU button to switch off. Is that OK?', ar:'النحلة مستعجلة وتريد الإطفاء من زر وحدة المعالجة. هل هذا صحيح؟', choices:[C('No!',SV.no,1),C('Yes',SV.ok)], why:'Never switch off the computer directly from the power button or the CPU.'}}
  ]
];

/* the road: learn, then play the games of each topic (book pages are a button, never a forced step) */
const NODES = [];
TOPICS.forEach((T,t)=>{
  NODES.push({t, kind:'learn', id:'learn-'+t, label:'Learn', ico:SV.bulb, c:'c-yellow'});
  T.games.forEach(g=>NODES.push({t, kind:'game', id:g, label:GAMEDEF[g].t, ico:GAMEDEF[g].ico, c:GAMEDEF[g].c}));
});
S.done = S.done || {};
let curNode = null;
const isDone = n => !!(S.done[n.id] || S.best[n.id]);
const firstOpen = () => { const i=NODES.findIndex(n=>!isDone(n)); return i<0 ? NODES.length : i; };
const isOpen = i => !!S.unlockAll || i <= firstOpen();
const plainSteps = f => plain(f.en) + (f.steps ? ' ' + f.steps.map(s=>s[0]).join(', then ') + '.' : '');

function openNode(i){
  if (!isOpen(i)){ oops(); say('Finish the step before first!'); toast('🔒 Finish the step before first!'); return; }
  const n=NODES[i]; curNode=i; curTopic=n.t; M=null; clearTimeout(idleT); tone([[880,.08]]);
  if (n.kind==='book') viewBookNode(i); else if (n.kind==='learn') runLearn(i); else GAMEDEF[n.id].go();
  scrollTo(0,0);
}
function viewTopic(t){ viewHome(t); }

function viewBookNode(i){
  const n=NODES[i], T=TOPICS[n.t], v=bookViewer(T.pages);
  app.innerHTML = `<div class="viewhead"><button class="backbtn" data-map="1">‹ Map</button><h2>${T.title}</h2></div>
    <div class="card">${v.html}
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn bigbtn" id="readok">I read it ✓</button></div></div>`;
  v.wire(); say('Look at the book. '+T.title);
  app.querySelector('#readok').onclick=()=>{ S.done[n.id]=1; save(); praise(); setTimeout(()=>viewHome(n.t, true),900); };
}

function runLearn(i){
  const n=NODES[i], T=TOPICS[n.t], F=LEARN[n.t]; let k=0, phase='fact', miss=0;
  const total=F.length*2;
  function head(f){ return `<div class="viewhead"><button class="backbtn" data-map="1">‹ Map</button><h2>${T.title}</h2>${bookBtn(f.page)}</div>${bar(total, k*2+(phase==='q'?1:0))}`; }
  function draw(){
    const f=F[k];
    if (phase==='fact'){
      app.innerHTML = head(f) + `<div class="lstage lt${n.t%5}">
        <div class="lpic${f.steps?' small':''}"><span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>${f.pic}</div>
        <div class="lsay"><span class="lbee">${SV.bee}</span><div class="bubble"><p class="fline">${md(f.en)}</p><div class="ar">${f.ar}</div></div></div>
        ${f.steps?`<div class="ssteps lsteps">${f.steps.map((s,j)=>`${j?'<span class="arrow">➜</span>':''}<span class="sstep" style="animation-delay:${.25+j*.35}s">${s[1]}<span>${s[0]}</span></span>`).join('')}</div>`:''}
        <div class="row lbtns">${sayBtn(plainSteps(f))}<button class="btn bigbtn" id="fnext">Next ▶</button></div></div>`;
      say(plainSteps(f));
      app.querySelector('#fnext').onclick=()=>{ phase='q'; tone([[700,.06]]); draw(); };
    } else {
      const q=f.q, opts=q.order ? shuffle(q.choices.map((c,ix)=>[c[0],c[1],ix])) : shuffle(q.choices); let wrongHere=0, nextIx=0;
      app.innerHTML = head(f) + `<div class="lstage lt${n.t%5} qstage">
        <div class="lsay"><span class="lbee">${SV.bee}</span><div class="bubble"><p class="qline">${q.en}</p><div class="ar">${q.ar}</div></div>${sayBtn(q.en)}</div>
        <div class="qchoices${q.order?' order':''}">${opts.map((o,j)=>`<button class="qc" data-j="${j}">${o[1]}<span>${o[0]}</span></button>`).join('')}</div></div>`;
      say(q.en);
      app.querySelectorAll('.qc').forEach(b=>b.onclick=()=>{
        const o=opts[+b.dataset.j];
        if (q.order && o[2]===nextIx && nextIx<q.choices.length-1){
          nextIx++; wrongHere=0; b.disabled=true; b.classList.remove('hint'); b.classList.add('right','num'); b.dataset.n=nextIx; tone([[660+nextIx*110,.1]]); say(o[0]); return;
        }
        if (q.order ? o[2]===nextIx : o[2]){
          if (q.order){ b.classList.add('num'); b.dataset.n=nextIx+1; }
          app.querySelectorAll('.qc').forEach(x=>{ x.disabled=true; x.classList.remove('hint'); }); b.classList.add('right'); yay();
          const fb=document.createElement('div'); fb.className='fbk';
          fb.innerHTML=`<div class="fbk-in"><span class="ok">${SV.ok.replace('fill="#fff"','fill="#4DB131"').replace('stroke="#4DB131"','stroke="#fff"')}Correct!</span><p>${q.why}</p><button class="btn bigbtn" id="fbgo">Continue ▶</button></div>`;
          document.body.appendChild(fb); say('Correct! '+q.why);
          fb.querySelector('#fbgo').onclick=()=>{ fb.remove(); k++; phase='fact';
            if (k>=F.length) finish(n.id, miss, ()=>runLearn(i)); else draw(); scrollTo(0,0); };
        } else {
          miss++; wrongHere++; oops(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); say('Try again!');
          if (wrongHere>=2){ const j=opts.findIndex(x=>q.order ? x[2]===nextIx : x[2]); app.querySelector(`.qc[data-j="${j}"]`).classList.add('hint'); }
        }
      });
    }
  }
  draw();
}

/* end of a step: stars, then back to the map or straight to the next step */
function finish(id, mistakes, again){
  const stars = mistakes===0?3:mistakes<=2?2:1;
  FLY = (curNode!==null && curNode===firstOpen() && !S.unlockAll) ? curNode : null;
  S.best[id] = Math.max(S.best[id]||0, stars); S.done[id]=1; save();
  document.querySelectorAll('.fbk').forEach(x=>x.remove());
  confetti(); tone([[523,.12],[659,.12],[784,.12],[1047,.3]]); say(stars===3?'Perfect! Three stars!':'Well done!');
  const nx = curNode!==null && curNode+1<NODES.length ? curNode+1 : null;
  app.innerHTML = `<div class="card done">
    ${SV.bee.replace('<svg','<svg width="120" height="120"')}
    <h2>${stars===3?'Perfect!':'Well done!'}</h2>
    <div class="stars">${[1,2,3].map(k=>`<i class="${k<=stars?'on':''}">★</i>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn alt" id="again">Play again</button><button class="btn alt" data-map="1">Map</button>${nx!==null?`<button class="btn" id="nextN">Next step ▶</button>`:''}</div>
  </div>`;
  app.querySelector('#again').onclick=again;
  const nn=app.querySelector('#nextN'); if(nn) nn.onclick=()=>{ if (FLY!==null) viewHome(undefined, true, nx); else openNode(nx); };
}

let FLY = null;
function viewHome(focusT, moved, autoOpen){
  const fly = FLY; FLY = null;
  curTopic=null; curNode=null; M=null; clearTimeout(idleT); document.querySelectorAll('.fbk').forEach(x=>x.remove());
  const open=firstOpen(), X=[0,64,0,-64];
  let html = `<section class="hero small">${SV.bee.replace('<svg','<svg class="bee"')}<div><h1>Let's learn Windows!</h1><p>Follow the road. Tap the shining step! ${sayBtn("Let's learn Windows! Follow the road. Tap the shining step!")}</p><div class="ar">اتبع الطريق واضغط على الخطوة اللامعة!</div></div></section><div class="map">`;
  let idx=0;
  TOPICS.forEach((T,t)=>{
    html += `<div class="tband" id="topic${t}"><span class="tnum ${T.color}">${t+1}</span><h3>${T.title}</h3>${bookBtn(T.pages)}</div><div class="nodes">`;
    NODES.forEach((n,i)=>{ if(n.t!==t) return;
      const done=isDone(n), now=i===open && !S.unlockAll || (S.unlockAll && i===open), locked=!isOpen(i), x=X[idx++%4];
      html += `<button class="pnode ${done?'done':''} ${now?'now':''} ${locked?'locked':''}" style="--x:${x}px" data-node="${i}" aria-label="${n.label}${locked?' (locked)':''}">
        <span class="disc ${n.c}">${n.ico}${done?'<span class="tick">✓</span>':locked?'<span class="lockb">🔒</span>':''}</span>
        <span class="plabel">${n.label}</span>
        ${now?`<span class="startbub ${x>0?'l':'r'}">${SV.bee}<b>Start!</b></span>`:''}</button>`;
    });
    html += `</div>`;
  });
  html += `<div class="mapend">${SV.hive}<span>Finish!</span></div></div><div class="maptools"><button class="viewbtn" data-book="${PAGES.join(',')}">${SV.book.replace('<svg','<svg width="20" height="20" style="vertical-align:-4px"')} See all book pages</button><button class="viewbtn" data-free="1">Free play on the computer</button></div>
    <button class="reset" id="reset">Start again (clear my stars)</button>
    <button class="teach" id="teach">${S.unlockAll?'Teacher: lock the steps again':'Teacher: open all steps'}</button>`;
  app.innerHTML = html;
  drawRoad();
  app.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>openNode(+b.dataset.node));
  app.querySelector('[data-free]').onclick=()=>{ curNode=null; startMission('free'); };
  const r=app.querySelector('#reset'); r.onclick=()=>{
    if (r.dataset.sure){ S.learned={}; S.best={}; S.done={}; save(); viewHome(); } else { r.dataset.sure=1; r.textContent='Tap again to clear all stars'; }
  };
  const te=app.querySelector('#teach'); te.onclick=()=>{
    if (te.dataset.sure || S.unlockAll){ S.unlockAll=!S.unlockAll; save(); viewHome(); } else { te.dataset.sure=1; te.textContent='Tap again to open all steps'; }
  };
  const target = focusT!==undefined ? (moved ? app.querySelector('.pnode.now') || app.querySelector('#topic'+focusT) : app.querySelector('#topic'+focusT)) : (open>2 ? app.querySelector('.pnode.now') : null);
  if (fly!==null && app.querySelector('.pnode.now')) return flyBee(fly, autoOpen);
  if (target) target.scrollIntoView({block:'center'}); else scrollTo(0,0);
}

/* a winding honey road through the garden, drawn through the step buttons */
const DECO = [SV.flower1, SV.flower2, SV.tree, SV.flower3];
function drawRoad(){
  const map=app.querySelector('.map'); if(!map) return;
  map.querySelectorAll('.road,.deco').forEach(e=>e.remove());
  const mr=map.getBoundingClientRect(), pts=[...map.querySelectorAll('.pnode .disc')].map(d=>{const r=d.getBoundingClientRect(); return [r.left-mr.left+r.width/2, r.top-mr.top+r.height/2];});
  const end=map.querySelector('.mapend svg'); if(end){const r=end.getBoundingClientRect(); pts.push([r.left-mr.left+r.width/2, r.top-mr.top+r.height/2]);}
  if(pts.length<2) return;
  const path=a=>{ let d=`M${a[0][0]},${a[0][1]}`; for(let i=1;i<a.length;i++){ const [x0,y0]=a[i-1],[x1,y1]=a[i], my=(y0+y1)/2; d+=` C${x0},${my} ${x1},${my} ${x1},${y1}`; } return d; };
  const nDone=Math.max(1, firstOpen()+1), dAll=path(pts), dDone=path(pts.slice(0, Math.min(nDone, pts.length)));
  const W=mr.width, H=mr.height, bands=[...map.querySelectorAll('.tband')].map(b=>{const r=b.getBoundingClientRect(); return [r.top-mr.top, r.bottom-mr.top];});
  map.insertAdjacentHTML('afterbegin', `<svg class="road" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${dAll}" fill="none" stroke="#c98f3d" stroke-width="46" stroke-linecap="round"/>
    <path d="${dAll}" fill="none" stroke="#f9e2a8" stroke-width="36" stroke-linecap="round"/>
    ${firstOpen()>0?`<path d="${dDone}" fill="none" stroke="#FFC21A" stroke-width="36" stroke-linecap="round"/>`:''}
    <path d="${dAll}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" opacity=".9"/></svg>`);
  // flowers and trees on the grass, away from the road
  let k=0; for(let y=230; y<H-120; y+=150){ for(const side of [0,1]){ const x = side? W-64-((k*37)%30) : 8+((k*23)%26);
    const near=pts.some(p=>Math.abs(p[0]-(x+28))<95 && Math.abs(p[1]-(y+28))<80) || bands.some(r=>y+60>r[0]-6 && y<r[1]+6); if(!near) map.insertAdjacentHTML('afterbegin', `<span class="deco" style="left:${x}px;top:${y}px">${DECO[k%DECO.length]}</span>`); k++; } }
}
addEventListener('resize', ()=>{ clearTimeout(drawRoad.t); drawRoad.t=setTimeout(drawRoad,150); });

/* the bee flies from the step just finished to the next step */
function flyBee(from, autoOpen){
  const a=app.querySelector(`[data-node="${from}"] .disc`), nowB=app.querySelector('.pnode.now'), b=nowB.querySelector('.disc'), bub=nowB.querySelector('.startbub');
  if (!a){ nowB.scrollIntoView({block:'center'}); return; }
  if (bub) bub.style.opacity='0';
  a.scrollIntoView({block:'center'});
  const pos=el=>{ const r=el.getBoundingClientRect(); return [r.left+scrollX+r.width/2, r.top+scrollY+r.height/2]; };
  const [x1,y1]=pos(a), [x2,y2]=pos(b), S2=78;
  const bee=document.createElement('div'); bee.className='flybee'; bee.innerHTML=SV.bee;
  bee.style.left=(x1-S2/2)+'px'; bee.style.top=(y1-S2/2-50)+'px'; document.body.appendChild(bee);
  const dx=x2-x1, dy=y2-y1, hop=Math.min(120, 40+Math.abs(dy)/3);
  setTimeout(()=>{
    tone([[660,.08],[880,.08],[1100,.12]]);
    b.scrollIntoView({block:'center', behavior:'smooth'});
    const anim=bee.animate([
      {transform:'translate(0,0) rotate(0deg) scale(1)'},
      {transform:`translate(${dx*.25}px,${dy*.25-hop}px) rotate(-12deg) scale(1.15)`,offset:.3},
      {transform:`translate(${dx*.6}px,${dy*.6-hop*.8}px) rotate(10deg) scale(1.15)`,offset:.6},
      {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(1)`}
    ],{duration:1600, easing:'ease-in-out', fill:'forwards'});
    anim.onfinish=()=>{
      bee.remove(); if (bub){ bub.style.transition='opacity .2s'; bub.style.opacity='1'; }
      b.classList.add('landed'); setTimeout(()=>b.classList.remove('landed'),600); tone([[1047,.15]]); say('Next step!');
      if (autoOpen!==undefined) setTimeout(()=>{ if (app.contains(nowB)) openNode(autoOpen); }, 1100);
    };
  }, 450);
}
document.addEventListener('click', e=>{ if (e.target.closest('[data-map]')){ const t=curTopic; M=null; clearTimeout(idleT); try{speechSynthesis.cancel()}catch(_){} viewHome(t===null?undefined:t, true); } });
document.getElementById('homeBtn').onclick=()=>viewHome();
new MutationObserver(()=>app.querySelectorAll('[data-back]').forEach(b=>{ if(b.textContent!=='‹ Map') b.textContent='‹ Map'; })).observe(app,{childList:true,subtree:true});
viewHome();
</script>

   - the student writes a name, then does every task with NO hints,

const EXK = 'ict-exam-results-v1', EXSET = 'ict-exam-settings-v1';

const exMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+(m||0); };
const exYmd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function exOpenNow(now=new Date()){ const L=exSlots(); if (!L.length) return true; const m=now.getHours()*60+now.getMinutes(); return L.some(sl=>exSlotOn(sl,now) && m>=exMin(sl.from) && m<exMin(sl.to)); }

  for (let k=0;k<370 && !best;k++){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k);

function exBegin(name, cls){
  if (!exOpenNow()){ exWelcome(); return; }
  const now=new Date();
  ITEMS = exBuild(); EXMAX = ITEMS.reduce((a,it)=>a+it.max,0);
  EX.rec = { id: now.getTime().toString(36)+Math.random().toString(36).slice(2,6), grade:EXAM.grade, exam:EXAM.title+' — '+EXAM.sub,
    name, cls, start:now.toISOString(), end:null, status:'in progress', score:0, max:EXMAX, items:[], sent:false };
  const all=exAll(); all.push(EX.rec); exWrite(all);
  EXON=true; EX.i=0; exPill(); exShow();
}
function exSaveRec(){ const all=exAll(), k=all.findIndex(r=>r.id===EX.rec.id); if(k<0) all.push(EX.rec); else all[k]=EX.rec; exWrite(all); }
function exClear(){ EX.timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); EX.timers=[]; SIMT.forEach(clearTimeout); SIMT.clear(); if (typeof busy!=='undefined') busy=false; clearTimeout(idleT); if (typeof saverT!=='undefined') clearTimeout(saverT); if (typeof stopMusic==='function') stopMusic(); }

function exTop(skip){
  return `<div class="ex-top"><span class="ex-num">${EX.i+1} / ${ITEMS.length}</span><div class="ex-prog"><i style="width:${EX.i/ITEMS.length*100}%"></i></div>${skip?'<button class="ex-skip" id="exSkip">Next task ›</button>':''}</div>`;
}
const exSay = t => `<button class="ex-sayb" data-exsay="${exEsc(t)}" aria-label="Listen">${exIco.speaker}</button>`;
app.addEventListener('click', e=>{ const b=e.target.closest('[data-exsay]'); if (b){ e.stopPropagation(); speak(b.dataset.exsay); } }, true);
function exWireSkip(onSkip){
  const b=app.querySelector('#exSkip'); if(!b) return; let t=null;
  b.onclick=()=>{
    if (!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent='Tap again to go on ›'; clearTimeout(t); t=setTimeout(()=>{ b.classList.remove('sure'); b.textContent='Next task ›'; },3000); return; }
    clearTimeout(t); onSkip();
  };
}

function exShow(){
  exClear();
  if (EX.i>=ITEMS.length) return exEnd();
  const it = EX.item = ITEMS[EX.i]; EX.t0 = Date.now(); EX.lastOk={id:null,t:0};
  app.classList.remove('ex-sim');
  if (it.type==='sim') return exSim(it);
  if (it.type==='find') return exFind(it);
  if (it.type==='choice') return exChoice(it);
  if (it.type==='tap') return exTap(it);
  if (it.type==='part') return exPart(it);
}

function exRecord(r){
  const it=EX.item;
  EX.rec.items[EX.i] = { n:it.n, task:it.title||it.q, type:it.type, got:r.got, max:it.max, wrong:r.wrong||0, skipped:!!r.skipped,
    answer:r.answer||'', sec:Math.round((Date.now()-EX.t0)/1000) };
  EX.rec.score = EX.rec.items.reduce((a,x)=>a+(x?x.got:0),0);
  exSaveRec();
  EX.i++; exShow();
}

/* 1. simulation task */
function exSim(it){
  startMission(it.key);
  app.classList.add('ex-sim');
  app.querySelectorAll('.viewhead,#mhelp,.simtools').forEach(x=>x.remove());
  app.insertAdjacentHTML('afterbegin', exTop(true));
  const mb=app.querySelector('.mbar');
  const ms=app.querySelector('#msay'); if (ms){ ms.onclick=null; ms.setAttribute('data-exsay', it.q); }
  exWireSkip(()=>{ const m=M; if(!m) return; M=null; exClear(); exLog(m, m.i); exSimEnd(m,true); });
  if (it.from){
    for (let k=0; k<it.from && M; k++){
      const id=M.steps[k][0];
      const el=app.querySelector(`#simbox [data-act="${id}"]:not([data-ss="none"])`);
      _act(id, el);
    }
    if (M){ M._log=Array(it.from).fill(-1); M._base=M.miss=0; M._from=it.from; renderSim(); }
  }
  EX.timers.push(setTimeout(()=>speak(it.q), 300));
  scrollTo(0,0);
}

/* find a part of the desktop on the simulated computer: the first tap is the answer */
MISSIONS.__desk = {title:'Desktop', page:[], start:'desk', steps:[['__none','','','']]};
function exFind(it){
  startMission('__desk');
  app.classList.add('ex-sim');
  app.querySelectorAll('.viewhead,#mhelp,.simtools').forEach(x=>x.remove());
  app.insertAdjacentHTML('afterbegin', exTop(false));
  const ms=app.querySelector('#msay'); if (ms){ ms.onclick=null; ms.setAttribute('data-exsay', it.q); }
  const box=app.querySelector('#simbox'); let done=false;
  const stop=e=>{ e.stopPropagation(); e.preventDefault(); };
  ['contextmenu','pointerdown','dblclick'].forEach(ev=>box.addEventListener(ev, stop, true));
  box.addEventListener('click', e=>{
    stop(e); if (done) return; done=true;
    /* hit test by position, so parts drawn on top (like gadgets) count too */
    const x=e.clientX, y=e.clientY, inside=sel=>[...box.querySelectorAll(sel)].some(el=>{ const r=el.getBoundingClientRect(); return r.width>0 && x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; });
    const hit = inside(it.sel) && !(it.not && inside(it.not));
    const r=box.getBoundingClientRect(), d=document.createElement('div'); d.className='ex-dot';
    d.style.left=(e.clientX-r.left)+'px'; d.style.top=(e.clientY-r.top)+'px'; box.appendChild(d); tick();
    EX.timers.push(setTimeout(()=>{ M=null; exRecord({got:hit?1:0, answer:hit?'right place':'other place'}); }, 650));
  }, true);
  EX.timers.push(setTimeout(()=>speak(it.q), 300));
  scrollTo(0,0);
}

/* 3. tap on the desktop picture */
function exTap(it){
  app.innerHTML = `${exTop()}<div class="ex-card">

    let hit = ZONES[it.zone].some(([a,b,c,dd])=>x>=a&&x<=c&&y>=b&&y<=dd);

/* ---------- send a finished result to the teacher's Google Sheet (optional) ---------- */
function exRow(r){
  const d=new Date(r.start), mins=r.end?Math.max(1,Math.round((new Date(r.end)-d)/60000)):'';
  return { date:d.toLocaleDateString('en-GB'), time:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), grade:r.grade, name:r.name, cls:r.cls,
    score:r.score, max:r.max, pct:Math.round(r.score/r.max*100), minutes:mins, status:r.status,
    details:r.items.filter(Boolean).map(x=>`${x.n}. ${x.task.replace(/<[^>]+>/g,'')}: ${x.got}/${x.max}${x.skipped?' (skipped)':''}`).join(' | '), id:r.id };
}
function exSend(r){
  const url=exSettings().sheet; if (!url || r.status!=='finished') return Promise.resolve(false);
  return fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(exRow(r))})
    .then(()=>{ const all=exAll(), k=all.findIndex(x=>x.id===r.id); if(k>=0){ all[k].sent=true; exWrite(all); } return true; })
    .catch(()=>false);
}

    ${rows.map(r=>{ const p=Math.round(r.score/r.max*100); return `<tr class="tp-row" data-id="${r.id}"><td>${tpDate(r.start)}</td><td><b>${exEsc(r.name)}</b></td><td>${exEsc(r.cls||'')}</td><td>${r.grade}</td>
      <td class="num"><b>${r.score}</b> / ${r.max}</td><td class="num">${p}%<span class="pctbar"><i style="width:${p}%;background:${pc(p)}"></i></span></td><td>${tpMins(r)}</td>
      <td><span class="tag ${r.status==='finished'?'ok':'wip'}">${r.status==='finished'?'Finished':'Not finished'}</span></td>
      <td class="noprint"><button class="tp-btn l" data-del="${r.id}" title="Delete this result">🗑</button></td></tr>
      <tr class="det" data-det="${r.id}" style="display:${tpOpenRow===r.id?'table-row':'none'}"><td colspan="9"><ol>${r.items.filter(Boolean).map(x=>`<li><span class="${x.got===x.max?'y':'n'}">${x.got}/${x.max}</span> ${exEsc(x.task.replace(/<[^>]+>/g,''))}${x.type==='sim'&&x.wrong?` <span class="tp-note">(${x.wrong} wrong click${x.wrong>1?'s':''})</span>`:''}${x.skipped?' <span class="tp-note">(skipped)</span>':''}${x.type!=='sim'&&!x.got&&x.answer?` <span class="tp-note">(chose: ${exEsc(x.answer)})</span>`:''} <span class="tp-note">· ${x.sec}s</span></li>`).join('')||'<li>No answers yet.</li>'}</ol></td></tr>`; }).join('')}
  </tbody></table></div>`:`<div class="tp-empty">No results yet. When a student finishes the quiz on this computer, the mark appears here.</div>`}
  <p class="tp-note noprint" style="margin-top:12px">Click a student to see every task. Results are saved in this browser on this computer${sheet?' and sent to your Google Sheet':''}.</p>`;
  B.querySelector('#tpG').onchange=e=>{ tpFilter.grade=e.target.value; tpList(); };
  B.querySelector('#tpS').onchange=e=>{ tpFilter.status=e.target.value; tpList(); };
  const qi=B.querySelector('#tpQ'); qi.oninput=()=>{ tpFilter.q=qi.value; const pos=qi.selectionStart; tpList(); const n=TP.querySelector('#tpQ'); n.focus(); n.setSelectionRange(pos,pos); };
  B.querySelector('#tpCsv').onclick=()=>tpCsv(rows);
  B.querySelector('#tpPrint').onclick=()=>print();
  B.querySelector('#tpSet').onclick=tpSettings;
  const rs=B.querySelector('#tpResend'); if(rs) rs.onclick=()=>{ rs.disabled=true; rs.textContent='Sending…'; Promise.all(exAll().filter(r=>r.status==='finished'&&!r.sent).map(exSend)).then(tpList); };
  B.querySelectorAll('tr.tp-row').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('[data-del]')) return; const id=tr.dataset.id; tpOpenRow = tpOpenRow===id?null:id; const d=B.querySelector(`[data-det="${id}"]`); B.querySelectorAll('tr.det').forEach(x=>{ if(x!==d) x.style.display='none'; }); d.style.display = tpOpenRow===id?'table-row':'none'; });
  B.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('r')){ b.classList.add('r'); b.classList.remove('l'); b.textContent='Delete?'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('r'); b.classList.add('l'); b.textContent='🗑'; } },3000); return; }
    exWrite(exAll().filter(r=>r.id!==b.dataset.del)); tpList();
  });
}
function tpCsv(rows){
  const head=['Date','Time','Grade','Name','Class','Mark','Out of','Percent','Minutes','Status','Details'];
  const q=v=>{ v=String(v==null?'':v); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[head.join(',')].concat(rows.map(r=>{ const x=exRow(r); return [x.date,x.time,x.grade,x.name,x.cls,x.score,x.max,x.pct,x.minutes,x.status,x.details].map(q).join(','); }));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ICT quiz results ${tpFilter.grade==='all'?'all grades':'grade '+tpFilter.grade} ${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const SHEET_CODE = `function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  var d = JSON.parse(e.postData.contents);
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['Date','Time','Grade','Name','Class','Mark','Out of',
                     'Percent','Minutes','Status','Details','ID']);
  }
  sheet.appendRow([d.date, d.time, d.grade, d.name, d.cls, d.score, d.max,
                   d.pct, d.minutes, d.status, d.details, d.id]);
  return ContentService.createTextOutput('ok');
}`;
function tpSettings(){
  const s=exSettings(), B=TP.querySelector('#tpB');
  B.innerHTML=`<div class="tp-set">
    <div><button class="tp-btn l" id="tpBack">‹ Back to results</button></div>
    <div class="tp-sec"><h3>Google Sheet (collect marks from all computers)</h3>
      <p class="tp-note" style="margin:0 0 6px">Optional. Without it, marks stay on each computer and you export them from here. With it, every finished quiz is also added to one Google Sheet.</p>
      <ol>
        <li>Open a new Google Sheet. Click <b>Extensions › Apps Script</b>.</li>
        <li>Delete what is there and paste this code. Click <b>Save</b>.</li>
      </ol>
      <pre id="tpCode">${exEsc(SHEET_CODE)}</pre>
      <button class="tp-btn l" id="tpCopy">Copy the code</button>
      <ol start="3">
        <li>Click <b>Deploy › New deployment</b>. Type: <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Click <b>Deploy</b> and allow access.</li>
        <li>Copy the <b>Web app URL</b> (it ends with <b>/exec</b>) and paste it here. Do this once on every computer, or ask Claude to put the link inside the quiz files.</li>
      </ol>
      <input type="url" id="tpUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${exEsc(s.sheet)}">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tp-btn g" id="tpSaveUrl">Save link</button><button class="tp-btn l" id="tpTest">Send a test row</button><span class="tp-note" id="tpUrlMsg"></span></div>
    </div>
    <div class="tp-sec"><h3>Change the teacher PIN</h3>
      <input type="password" inputmode="numeric" id="tpNew" placeholder="New PIN (4 or more numbers)" autocomplete="off">
      <button class="tp-btn" id="tpPinSave">Save new PIN</button> <span class="tp-note" id="tpPinMsg"></span></div>
    <div class="tp-sec"><h3>Delete all results on this computer</h3>
      <p class="tp-note" style="margin:0 0 8px">Export to Excel first. This cannot be undone.</p>
      <button class="tp-btn r" id="tpWipe">Delete all results</button></div>
  </div>`;
  B.querySelector('#tpBack').onclick=tpList;
  B.querySelector('#tpCopy').onclick=e=>{ try{ navigator.clipboard.writeText(SHEET_CODE); e.target.textContent='Copied ✓'; }catch(_){ e.target.textContent='Select the code and copy it'; } };
  const msg=B.querySelector('#tpUrlMsg');
  B.querySelector('#tpSaveUrl').onclick=()=>{ const v=B.querySelector('#tpUrl').value.trim(); if(v && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ msg.textContent='The link must start with https://script.google.com and end with /exec'; return; } s.sheet=v; exSetSettings(s); msg.textContent=v?'Saved ✓':'Removed'; };
  B.querySelector('#tpTest').onclick=()=>{ const v=B.querySelector('#tpUrl').value.trim(); if(!v){ msg.textContent='Paste the link first.'; return; }
    fetch(v,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({date:new Date().toLocaleDateString('en-GB'),time:'',grade:EXAM.grade,name:'TEST ROW',cls:'',score:0,max:0,pct:0,minutes:0,status:'test',details:'You can delete this row.',id:'test'})})
      .then(()=>msg.textContent='Sent. Look in your Google Sheet for a TEST ROW.').catch(()=>msg.textContent='Could not send. Check the internet and the link.'); };
  B.querySelector('#tpPinSave').onclick=()=>{ const v=B.querySelector('#tpNew').value.trim(), m=B.querySelector('#tpPinMsg'); if(!/^\d{4,}$/.test(v)){ m.textContent='Use 4 or more numbers.'; return; } s.pin=v; exSetSettings(s); m.textContent='Saved ✓'; };
  const w=B.querySelector('#tpWipe'); w.onclick=()=>{ if(!w.dataset.sure){ w.dataset.sure=1; w.textContent='Tap again to delete everything'; return; } exWrite([]); tpList(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && TP) teacherClose(); });

/* go */
exWelcome();
