.notif{display:flex;align-items:center;gap:6px;margin-left:auto}
.ni{display:grid;place-items:center;width:28px;height:28px;color:#fff;font-size:11px;background:transparent;border-radius:4px;padding:0}
.ni svg{width:20px;height:20px}
button.ni{background:#ffffff1a}
.notif .clock{margin-left:6px}
.volpop{position:absolute;right:70px;bottom:56px;width:110px;height:200px;background:linear-gradient(#f4f8fc,#dbe6f2);border:1px solid #6b8bb3;border-radius:6px;color:#16305A;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px;font-size:14px;box-shadow:0 8px 20px #0006}
.volpop input{writing-mode:vertical-lr;direction:rtl;height:120px;width:30px}
.shutrow{margin-top:auto;display:flex}
.shutrow .shutbtn{margin-top:0;border-radius:4px 0 0 4px}
.shutarrow{background:linear-gradient(#eef4fb,#a9c2df);color:#16305A;border:1px solid #6b8bb3;border-left:0;border-radius:0 4px 4px 0;padding:0 10px;font-size:18px}
.smR{position:relative}
.optlist{position:absolute;left:100%;bottom:0;margin-left:10px;width:190px;background:#fff;border:1px solid #6b8bb3;border-radius:4px;padding:4px;box-shadow:0 8px 20px #0006;z-index:3}
.gad{position:absolute;left:600px;pointer-events:none}
.gad svg{width:100%;height:100%;display:block}
.gclock{top:10px;width:100px;height:100px}
.gcal{top:122px;width:100px;height:100px;background:linear-gradient(#fff,#e9eef5);border:3px solid #9cc3ea;border-radius:10px;color:#16305A;text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.05;overflow:hidden}
.gday{font-size:14px;background:#F2562B;color:#fff;padding:3px}
.gnum{font-size:40px;font-weight:700}
.gmon{font-size:13px}
.sticky{position:absolute;left:330px;top:230px;width:210px;height:150px;border:1px solid #c9b74a;box-shadow:0 6px 14px #0005;display:flex;flex-direction:column;color:#3b3200}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:0 6px;height:24px;font-size:18px}
.sbar button{background:transparent;font-size:16px;color:#3b3200}
.sticky textarea{flex:1;border:0;background:transparent;resize:none;padding:4px 10px;font:17px "Segoe Print","Comic Sans MS",cursive;color:#3b3200;outline:none}
.scolors{position:absolute;left:100%;top:0;margin-left:6px;background:#fff;border:1px solid #6b8bb3;padding:6px;display:grid;grid-template-columns:repeat(2,34px);gap:6px;border-radius:4px;box-shadow:0 6px 14px #0005;z-index:4}
.scolors button{width:34px;height:34px;border:1px solid #8a99ad;border-radius:4px}
.npmenu{display:flex;gap:14px;padding:3px 10px;font-size:14px;border-bottom:1px solid #d5dce8;background:#f6f8fb}
.npwrap{flex:1;display:flex;min-height:0}
.npwrap .npad{flex:1}
.vs{width:16px;background:#e6ebf2;border-left:1px solid #c5cfdb;position:relative}
.vs i{position:absolute;left:2px;right:2px;top:16px;height:50px;background:#c9d6e6;border-radius:3px}
.hs{height:16px;background:#e6ebf2;border-top:1px solid #c5cfdb;position:relative;margin-right:16px;flex:none}
.hs i{position:absolute;top:2px;bottom:2px;left:16px;width:90px;background:#c9d6e6;border-radius:3px}
.netgrid{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10px}
.netgrid .drive{flex-direction:column;font-size:12px}
.bintools{display:flex;gap:8px;padding:6px 10px;background:#f1f6fc;border-bottom:1px solid #d5dce8}
.bintools button{background:transparent;border:1px solid transparent;border-radius:3px;padding:4px 8px;font-size:14px;color:#16305A}
.bintools button:not(.dim){border-color:#9cc3ea;background:#fff}
.bintools .dim{opacity:.45}
.binmain{flex:1;padding:14px;display:flex;align-items:flex-start;gap:12px}
.binfile{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:1px solid transparent;border-radius:4px;padding:6px;font-size:14px;color:#16305A}
.binfile svg{width:56px;height:56px}
.binfile.sel{background:#cce4fb;border-color:#7fb4ea}
.empty{color:#5A7397;font-size:15px}
.binstatus{padding:4px 10px;border-top:1px solid #d5dce8;font-size:13px;background:#f1f6fc}
.powerbtn{display:flex;align-items:center;gap:10px;background:#1f2a3a;color:#fff;border:2px solid #4DB131;border-radius:999px;padding:10px 20px;font-size:20px}
.powerbtn svg{width:40px;height:40px}
.usertile{width:110px;height:110px;border-radius:14px;background:#fff;border:4px solid #cfe2f7;display:grid;place-items:center;padding:6px}
.usertile svg{width:96px;height:96px}
.keys{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-weight:700;color:var(--soft)}
.keycap{background:linear-gradient(#fff,#dfe6ef);border:2px solid #9aa9bd;border-bottom-width:6px;border-radius:10px;padding:10px 22px;font-weight:700;font-size:20px;color:var(--ink)}
.keycap:active{border-bottom-width:2px;transform:translateY(4px)}
/* boot game */
.bootstage{display:flex;align-items:flex-end;justify-content:center;gap:18px;background:#FDEBD3;border-radius:22px;padding:22px 14px;box-shadow:0 8px 0 #16305a26;flex-wrap:wrap}
.bmon{position:relative;width:min(560px,100%);background:#22324a;border-radius:16px;padding:14px 14px 34px}
.bscreen{position:relative;aspect-ratio:16/10;background:#06090f;border-radius:6px;overflow:hidden;color:#fff;display:grid;place-items:center}
.bmon .bled{position:absolute;right:22px;bottom:12px}
.bled{width:12px;height:12px;border-radius:50%;background:#3a2622;display:inline-block}
.bled.on{background:#5df05d;box-shadow:0 0 8px #5df05d}
.bcpu{width:120px;height:230px;background:linear-gradient(#e2453a,#c43a30);border:4px solid #cfd6e0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-family:var(--display);font-size:24px}
.bbtn{width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center}
.bbtn svg{width:58px;height:58px}
.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:86%}
.chk{display:flex;align-items:center;gap:8px;background:#ffffff14;border-radius:10px;padding:6px 10px;font-size:clamp(14px,2.6vw,20px);opacity:0;animation:chkin .4s forwards}
.chk svg{width:clamp(30px,6vw,48px);height:clamp(30px,6vw,48px);background:#fff;border-radius:8px;padding:3px;flex:none}
.chk b{margin-left:auto;color:#5df05d;font-size:1.4em}
@keyframes chkin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.beepbox{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s}
.beepbox svg{width:clamp(60px,14vw,110px);height:auto;background:#fff;border-radius:50%;padding:8px}
.beepbox b{font-family:var(--display);font-size:clamp(30px,7vw,54px);color:var(--yellow)}
.load{display:flex;align-items:center;gap:8px;width:92%}
.lpart{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(13px,2.4vw,18px)}
.lpart svg{width:clamp(56px,11vw,90px);height:auto;background:#fff;border-radius:12px;padding:4px}
.lpath{flex:1;height:8px;border-radius:9px;background:repeating-linear-gradient(90deg,#ffffff55 0 12px,transparent 12px 22px);position:relative}
.lfly{position:absolute;top:50%;left:0;width:clamp(34px,7vw,56px);transform:translate(-50%,-50%);animation:fly 3.6s ease-in-out infinite}
.lfly svg{width:100%;height:auto;display:block}
@keyframes fly{0%{left:0}90%,100%{left:100%}}
.bscreen .overlay svg{width:30%;height:auto}
.bscreen .overlay{font-size:clamp(16px,3vw,24px)}
/* parts game */
.npwin{background:#fff;border:2px solid #5d84b4;border-radius:10px;overflow:visible;box-shadow:0 10px 24px #16305a40;font-family:"Segoe UI",Tahoma,sans-serif;color:#16305A;user-select:none}
[data-part]{position:relative;cursor:pointer}
.np-title{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:linear-gradient(#d3e6fb,#9cc0eb);font-size:clamp(15px,3vw,19px);border-radius:8px 8px 0 0}
.np-ico svg{width:26px;height:26px;display:block}
.np-name{flex:1;min-width:0}
.np-btns{display:flex;gap:4px}
.np-b{width:clamp(40px,8vw,56px);height:34px;display:grid;place-items:center;background:#e4eef9;border:1px solid #7b9cc6;border-radius:4px}
.np-b svg{width:100%;height:100%}
.np-x{background:linear-gradient(#f09a83,#c6402a);color:#fff;font-weight:800;font-size:20px;border-color:#8e2b1b}
.np-menu{display:flex;gap:clamp(10px,3vw,22px);padding:6px 12px;border-bottom:1px solid #d5dce8;background:#f6f8fb;font-size:clamp(15px,3vw,18px)}
.np-body{display:flex;min-height:200px}
.np-text{flex:1;padding:12px;font-family:Consolas,monospace;font-size:clamp(15px,3vw,19px);line-height:1.6}
.np-v{width:34px;background:#e6ebf2;border-left:1px solid #c5cfdb;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}
.np-v i{flex:1;width:20px;margin:6px 0;background:#c9d6e6;border-radius:4px;max-height:70px}
.np-h{height:34px;background:#e6ebf2;border-top:1px solid #c5cfdb;display:flex;align-items:center;gap:6px;padding:0 6px;margin-right:34px;font-size:13px;border-radius:0 0 0 8px}
.np-h i{width:120px;height:20px;background:#c9d6e6;border-radius:4px}
[data-part].found{outline:4px solid var(--green);outline-offset:-4px}
.np-menu.found,.np-title.found{background-color:#e7f8df}
.ptag{position:absolute;z-index:4;left:50%;top:100%;transform:translate(-50%,4px);background:var(--green);color:#fff;font-style:normal;font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;white-space:nowrap;pointer-events:none;font-family:var(--body)}
.np-v .ptag{left:auto;right:100%;top:40%;transform:translate(-4px,0)}
.np-h .ptag{top:auto;bottom:100%;transform:translate(-50%,-4px)}
.np-title > .ptag{left:52%;top:50%;transform:translate(-50%,-50%)}
.npwin{margin-top:56px}
.np-b .ptag{top:auto;bottom:100%;transform:translate(-50%,-6px)}
.np-b[data-part="max"] .ptag{transform:translate(-50%,-34px)}
.np-x .ptag{top:auto;bottom:100%;transform:translate(-50%,-6px)}
/* ===== grade 3 additions ===== */
.win7{display:flex;flex-direction:column}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.drop{position:absolute;z-index:6;background:#fff;border:1px solid #8aa6c8;border-radius:4px;box-shadow:0 8px 20px #0005;padding:3px;display:flex;flex-direction:column;min-width:170px;color:#16305A}
.drop button{display:flex;align-items:center;gap:8px;background:transparent;padding:5px 10px;font-size:14px;text-align:left;border-radius:3px;color:#16305A}
.drop button:hover{background:#dcebfb}
.drop button svg{width:20px;height:20px;flex:none}
.drop button.on{background:#dcebfb;font-weight:700}
.drop hr,.ctx hr{border:0;border-top:1px solid #d5dce8;margin:3px 0}
.ctx{position:absolute;z-index:9;width:200px;background:#f4f7fb;border:1px solid #8aa6c8;box-shadow:0 8px 20px #0006;padding:3px;display:flex;flex-direction:column;color:#16305A}
.ctx button{display:flex;align-items:center;gap:8px;background:transparent;padding:4px 10px 4px 32px;font-size:15px;text-align:left;position:relative;color:#16305A;min-height:28px}
.ctx button svg{position:absolute;left:6px;width:20px;height:20px}
.ctx button:hover{background:#dcebfb}
.tbapp.pin{background:transparent;border-color:transparent}
.clockb{background:transparent;color:#fff;border-radius:4px;padding:2px 6px}
.clockb:hover{background:#ffffff22}
.clockpop{position:absolute;right:4px;bottom:54px;width:330px;background:linear-gradient(#fafcff,#e3ecf6);border:1px solid #6b8bb3;border-radius:6px;box-shadow:0 8px 24px #0006;color:#16305A;padding:10px;display:flex;flex-direction:column;gap:8px;z-index:8}
.clockpop > b{font-size:15px;text-align:center}
.cprow{display:flex;gap:8px;align-items:center}
.cplink{background:transparent;color:#1C6FC4;text-decoration:underline;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(7,26px);gap:2px;font-size:12px;text-align:center}
.mgrid b{font-size:11px;color:#5A7397}
.mgrid span,.mgrid button{height:22px;display:grid;place-items:center;border-radius:3px;background:transparent;font-size:12px;color:#16305A;padding:0}
.mgrid .on{background:#1C83E0;color:#fff}
.mgrid button:hover{background:#dcebfb}
/* explorer */
.addr{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#eef4fb;border-bottom:1px solid #c5d4e6;font-size:13px;color:#16305A;flex:none}
.addr .nb{width:24px;height:24px;border-radius:50%;background:#3d78c2;color:#fff;display:grid;place-items:center;font-size:10px}
.addr .path{flex:1;background:#fff;border:1px solid #9fb3cc;padding:3px 8px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .srch{width:110px;background:#fff;border:1px solid #9fb3cc;padding:3px 8px;color:#8a99ad}
.etool{display:flex;align-items:center;gap:4px;padding:3px 8px;background:linear-gradient(#f7fafd,#e3ebf5);border-bottom:1px solid #c5d4e6;flex:none}
.etool button{background:transparent;border:1px solid transparent;border-radius:3px;padding:3px 8px;font-size:14px;color:#16305A;display:flex;align-items:center;gap:4px}
.etool button:hover{border-color:#9cc3ea;background:#fff}
.etool button svg{width:18px;height:18px}
.drop.org{left:8px;top:58px}
.drop.view{right:8px;top:58px;min-width:150px}
.ebody{flex:1;display:flex;min-height:0}
.tree{width:165px;background:#f6f9fd;border-right:1px solid #d5dce8;overflow:hidden;padding:4px 0;display:flex;flex-direction:column;flex:none}
.tree .th{font-size:13px;color:#16305A;padding:4px 8px 2px}
.tr{display:flex;align-items:center;gap:6px;background:transparent;padding:2px 8px;font-size:13px;color:#16305A;text-align:left;white-space:nowrap;min-height:24px}
.tr svg{width:18px;height:18px;flex:none}
.tr.on{background:#cce4fb;outline:1px solid #7fb4ea}
.epane{flex:1;overflow:hidden;padding:8px;background:#fff;color:#16305A;min-width:0}
.lhead{display:flex;flex-direction:column;margin-bottom:8px;font-size:12px;color:#5A7397}
.lhead b{font-size:17px;color:#1C4F96}
.eitems{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.eitems.list,.eitems.det{flex-direction:column;flex-wrap:nowrap;gap:1px}
.eitem{display:flex;flex-direction:column;align-items:center;gap:3px;width:96px;padding:6px 4px;border:1px solid transparent;border-radius:3px;font-size:13px;text-align:center;cursor:pointer;word-break:break-word}
.eitem svg{width:52px;height:52px}
.eitem.medium{width:80px}.eitem.medium svg{width:38px;height:38px}
.eitem.list{flex-direction:row;width:auto;text-align:left;padding:2px 6px}.eitem.list svg{width:20px;height:20px}
.eitem.sel,.erow.sel{background:#cce4fb;border-color:#7fb4ea}
.eitem.cut,.erow.cut{opacity:.45}
.eitem input,.erow input{width:100%;font-size:13px;border:1px solid #1C83E0;padding:1px 3px;font-family:inherit}
.eitem .dbar{display:block;width:84px;height:8px;background:#e6e6e6;border:1px solid #aaa}
.eitem .dbar i{display:block;width:40%;height:100%;background:linear-gradient(#5fb1f5,#1c6fc4)}
.erow{display:grid;grid-template-columns:22px minmax(0,1.6fr) 1.2fr 1.3fr .6fr;gap:6px;align-items:center;padding:2px 4px;border:1px solid transparent;font-size:12.5px;cursor:pointer;white-space:nowrap}
.erow span{overflow:hidden;text-overflow:ellipsis}
.erow svg{width:20px;height:20px}
.erow.head{color:#5A7397;border-bottom:1px solid #d5dce8;cursor:default}
.estat{display:flex;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid #d5dce8;background:#f1f6fc;font-size:13px;color:#16305A;flex:none;height:44px}
.estat svg{width:30px;height:30px}
.modal7{position:absolute;inset:0;background:#16305a33;display:grid;place-items:center;z-index:10}
.mwin{width:300px;background:#fff;border:1px solid #5d84b4;border-radius:7px;box-shadow:0 12px 30px #0008;overflow:hidden;color:#16305A}
.mwin.wide{width:400px}
.mwin .wt{height:32px}
.mbody{display:flex;gap:12px;align-items:center;padding:14px;font-size:14px}
.mbody svg{width:46px;height:46px;flex:none}
.mbody p{margin:0}
.mbody.col{flex-direction:column;align-items:stretch}
.mbody label{display:flex;align-items:center;gap:8px}
.mbody input{flex:1;font-size:15px;padding:4px 6px;border:1px solid #7b9cc6;font-family:inherit}
.mbody .fake{flex:1;border:1px solid #c5cfdb;padding:4px 6px;background:#f4f6f9}
.mbtns{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;background:#f0f4f9;border-top:1px solid #d5dce8}
.mbtns button{min-width:76px;background:linear-gradient(#fff,#dbe5f1);border:1px solid #7b9cc6;border-radius:3px;padding:5px 10px;font-size:14px;color:#16305A}
/* paint */
.pribbon{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#e9f0f8;border-bottom:1px solid #c5d4e6;flex:none}
.pbtn{background:#1C6FC4;color:#fff;border-radius:3px;width:42px;height:26px;font-size:14px}
.ptab{font-size:13px;color:#16305A;padding:2px 8px}
.ptab.on{background:#fff;border:1px solid #c5d4e6;border-bottom:0}
.pribbon .ptools{margin-left:auto;display:flex;gap:6px;align-items:center}

.pribbon .ptools button.on{box-shadow:0 0 0 3px #16305A}
.plab{font-size:12px;color:#5A7397}
.drop.pmenu{left:8px;top:32px;width:230px}
.drop.psub{left:100%;top:150px;margin-left:2px;width:240px}

.drop.psub small{color:#5A7397}
.w-paint .paintSlot{flex:1;padding:8px;background:#c9d6e6;min-height:0}

/* calculator */
.cmenu{display:flex;gap:2px;padding:2px 6px;font-size:13px;background:#eef4fb;flex:none}
.cmenu button{background:transparent;padding:2px 8px;color:#16305A;font-size:13px}
.drop.cview{left:6px;top:24px}
.ckeys.sci{grid-template-columns:repeat(5,1fr)}
.ckeys.sci .eq{grid-column:span 2}
.dicon{text-shadow:0 1px 2px #000,0 0 3px #000,0 0 6px #0008}
.ckeys button.fn{background:linear-gradient(#f4f8ff,#d3e2f5);font-size:16px}
/* notepad/wordpad */
.w-note .npmenu,.w-note .hs{flex:none}
.wpribbon{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#e9f0f8;border-bottom:1px solid #c5d4e6;font-size:14px;flex:none}
.wpb{min-width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid #c5d4e6;background:#fff;border-radius:3px;color:#16305A;font-size:14px}
.wpb.wide{display:inline-flex;gap:4px;padding:0 8px;align-items:center}
.wpb svg{width:18px;height:18px}
.wpdoc{flex:1;background:#c9d6e6;padding:10px 30px;overflow:hidden}
.wppage{background:#fff;height:100%;padding:14px 20px;font-size:14px;color:#222;line-height:1.5;outline:none}
.wpimg{margin-top:10px;width:110px}
.wpimg svg{width:110px;height:auto}
/* personalization */
.persb{flex:1;display:flex;min-height:0}
.pside{width:150px;background:#eef4fb;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#1C6FC4;flex:none}
.pside b{color:#16305A}
.pmain{flex:1;padding:10px 14px;color:#16305A;display:flex;flex-direction:column;gap:6px;min-width:0}
.pmain h4,.bgb h4{margin:0;font-size:17px;color:#1C4F96;font-weight:600}
.pmain small,.bgb small{color:#5A7397;font-size:12px}
.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0}

/* ---------- saved progress ---------- */
const KEY = 'butterfly-windows-g3-v1';
let S = {learned:{}, best:{}, arabic:false, sound:true};
try { const j = JSON.parse(localStorage.getItem(KEY)||'null'); if (j) S = Object.assign(S, j); Object.keys(S.best).forEach(k=>{ if(k.startsWith('train-')||k.startsWith('blank')||k==='match') delete S.best[k]; }); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} updateStars(); }
function totalStars(){ return Object.values(S.best).reduce((a,b)=>a+b,0); }
function updateStars(){ document.getElementById('starCount').textContent = totalStars(); }

/* ---------- sound + voice ---------- */
let AC;
function tone(seq){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d); t+=d*.8; });
  } catch(e) {}
}
const yay = ()=>tone([[660,.12],[880,.12],[1175,.22]]);
const oops = ()=>tone([[300,.15],[220,.25]]);
function say(text){
  if (!S.sound) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.8; u.pitch=1.1; speechSynthesis.speak(u); } catch(e) {}
}
const sayBtn = t => `<button class="say" data-say="${t.replace(/"/g,'&quot;')}" aria-label="Listen">${SV.speaker}</button>`;
document.addEventListener('click', e=>{ const b=e.target.closest('[data-say]'); if (b){ e.stopPropagation(); say(b.dataset.say); } }, true);

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1100); }
const PRAISE = ['Great job!','Super!','Well done!','You got it!','Amazing!','Yes!'];
const praise = ()=>{ const p=PRAISE[Math.floor(Math.random()*PRAISE.length)]; toast(p+' ★'); yay(); say(p); };

/* confetti */
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#F2562B','#4DB131','#1C83E0','#FFC21A','#8C5BE0'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:5+Math.random()*6,vy:2+Math.random()*4,vx:-2+Math.random()*4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let n=0; (function f(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();}); if(++n<160) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------- book page window ---------- */
function openBook(pages){
  pages = [].concat(pages); let i=0;
  const m=document.createElement('div'); m.className='modal';
  const draw=()=>{ m.innerHTML=`<div class="win" role="dialog" aria-label="Book page">
    <div class="wintitle"><span>My Book · Page ${pages[i]}</span><button class="winx" aria-label="Close">✕</button></div>
    <div class="winbody"><img src="${pageImg(pages[i])}" alt="Book page ${pages[i]}"></div>
    ${pages.length>1?`<div class="pager"><button data-d="-1" aria-label="Previous page">‹</button><span>${i+1} / ${pages.length}</span><button data-d="1" aria-label="Next page">›</button></div>`:''}
  </div>`; };
  draw();
  m.addEventListener('click',e=>{
    if (e.target===m || e.target.closest('.winx')) { m.remove(); return; }
    const d=e.target.closest('[data-d]'); if (d){ i=(i+ +d.dataset.d+pages.length)%pages.length; draw(); }
  });
  document.body.appendChild(m); m.querySelector('.winx').focus();
}

/* ---------- shared game end ---------- */
function finish(id, mistakes, again, next){
  const stars = mistakes===0?3:mistakes<=2?2:1;
  S.best[id] = Math.max(S.best[id]||0, stars); save();
  confetti(); tone([[523,.12],[659,.12],[784,.12],[1047,.3]]); say(stars===3?'Perfect! Three stars!':'Well done!');
  app.innerHTML = `<div class="card done">
    ${SV.bee.replace('<svg','<svg width="120" height="120"')}
    <h2>${stars===3?'Perfect!':'Well done!'}</h2>
    <div class="stars">${[1,2,3].map(k=>`<i class="${k<=stars?'on':''}">★</i>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn alt" id="again">Play again</button>${curTopic!==null?`<button class="btn alt" id="lesson">Back to the lesson</button>`:''}${curTopic!==null&&curTopic<TOPICS.length-1?`<button class="btn" id="nextT">Next topic ›</button>`:''}</div>
  </div>`;
  app.querySelector('#again').onclick=again;
  const ls=app.querySelector('#lesson'); if(ls) ls.onclick=()=>viewTopic(curTopic);
  const nt=app.querySelector('#nextT'); if(nt) nt.onclick=()=>viewTopic(curTopic+1);
}

/* backgrounds are painted once into images: layered CSS gradients repaint too slowly on tablets */
const BGIMG = {};
function bgImg(k){
  if (BGIMG[k]) return BGIMG[k];
  const c=document.createElement('canvas'); c.width=720; c.height=450; const x=c.getContext('2d');
  const lin=(a,b,vert=true)=>{ const g=vert?x.createLinearGradient(0,0,0,450):x.createLinearGradient(0,0,720,450); g.addColorStop(0,a); g.addColorStop(1,b); x.fillStyle=g; x.fillRect(0,0,720,450); };
  const circ=(cx,cy,r,col)=>{ x.fillStyle=col; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); };
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  if (k==='windows'){ const g=x.createRadialGradient(430,190,10,430,190,520); g.addColorStop(0,'#63c3f5'); g.addColorStop(.4,'#1f7fd3'); g.addColorStop(1,'#0b3f8a'); x.fillStyle=g; x.fillRect(0,0,720,450); }
  if (k==='nature'){ lin('#7ed957','#1b8a3a',false); for(let i=0;i<14;i++){ x.save(); x.translate(rnd()*720,rnd()*450); x.rotate(rnd()*6); x.fillStyle=i%2?'#c8f07a':'#2f9a2f'; x.beginPath(); x.ellipse(0,0,46,18,0,0,7); x.fill(); x.restore(); } }
  if (k==='landscape'){ lin('#7cc7ff','#d6f0ff'); circ(560,100,48,'#ffe066'); x.fillStyle='#3d9b35'; x.beginPath(); x.ellipse(200,480,330,180,0,0,7); x.fill(); x.fillStyle='#2f7d2a'; x.beginPath(); x.ellipse(580,500,320,190,0,0,7); x.fill(); }
  if (k==='space'){ const g=x.createRadialGradient(290,180,10,290,180,480); g.addColorStop(0,'#3b2a7a'); g.addColorStop(1,'#0b0820'); x.fillStyle=g; x.fillRect(0,0,720,450); for(let i=0;i<120;i++) circ(rnd()*720,rnd()*450,rnd()*1.6+.3,'#fff'); circ(610,330,44,'#ffd27a'); x.strokeStyle='#ffe9b8'; x.lineWidth=4; x.beginPath(); x.ellipse(610,330,74,16,-.3,0,7); x.stroke(); }
  if (k==='flowers'){ lin('#ffe3f0','#ffc2dc'); const cols=['#ff7eb6','#ff9f43','#c56cf0','#ff6b6b']; for(let i=0;i<9;i++){ const fx=40+rnd()*640, fy=40+rnd()*370, r=22+rnd()*18, col=cols[i%4]; for(let p=0;p<6;p++) circ(fx+Math.cos(p*1.05)*r*.7, fy+Math.sin(p*1.05)*r*.7, r*.5, col); circ(fx,fy,r*.38,'#fff36b'); } }
  if (k==='sea'){ lin('#5ec8f8','#0a6fb5'); x.strokeStyle='#ffffff55'; x.lineWidth=5; for(let row=0;row<9;row++){ x.beginPath(); for(let px=0;px<=720;px+=10) x.lineTo(px, 70+row*45+Math.sin(px/40+row)*9); x.stroke(); } }
  return BGIMG[k]=c.toDataURL('image/jpeg',.85);
}

    const ar = stage===0 ? 'اضغط على الاسم الأساسي.' : stage===1 ? 'اضغط على الاسم الثانوي (الامتداد).' : 'أي برنامج أنشأ هذا الملف؟';
    app.innerHTML = `<div class="viewhead">${backBtn()}<h2>File names</h2>${bookBtn(28)}</div>${bar(qs.length,i)}
      <div class="card"><div class="prompt">${prompt} ${sayBtn(prompt)}</div><div class="ar">${ar}</div>

        <button class="fpart ${stage>0?'got':''}" data-f="primary">${p}</button><span class="fdot">.</span><button class="fpart ${stage>1?'got':''}" data-f="secondary">${ext}</button></div>
      ${stage===2?`<div class="choices">${MAKERS.map(([k,n,ico])=>`<button class="choice" data-o="${k}">${ico}<span>${n}</span></button>`).join('')}</div>`:''}
      </div>`;
    say(stage<2 ? prompt : p+' dot '+ext.split('').join(' ')+'. '+prompt);
    if (stage<2) app.querySelectorAll('.fpart').forEach(b=>b.onclick=()=>{
      if (b.dataset.f===want){ yay(); say(stage===0?'Yes! '+p+' is the primary name. The user gives it.':'Yes! dot '+ext+' is the secondary name. The program gives it.'); stage++; setTimeout(round,1700); }
      else { miss++; oops(); b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300}); }
    });
    else app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if (b.dataset.o===mk){ b.classList.add('right'); praise(); stage=0; i++; setTimeout(round,1500); }
      else { miss++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); oops(); }
    });
  }
  round();
}

function lockPromptHeight(){
  const mt=app.querySelector('.mtext'), b=app.querySelector('#mtxt'), tp=app.querySelector('#mtip'); if(!mt||!b||!M) return;
  const keep=b.textContent, keepTip=tp?tp.textContent:''; mt.style.minHeight='0px';

  if (tp) tp.textContent='Good! Now click two times, fast!';
  let mx=0; texts.forEach(t=>{ b.textContent=t; mx=Math.max(mx, mt.offsetHeight); });
  b.textContent=keep; if (tp) tp.textContent=keepTip; mt.style.minHeight=mx+'px';
}

function startMission(key){

  app.querySelector('#msay').onclick=()=>say(promptText());
  const h=app.querySelector('#mhelp'); if(h) h.onclick=()=>{ M.hint=true; renderSim(); say(promptText()); };
  const box=app.querySelector('#simbox');
  box.addEventListener('click', onSimClick);
  const rightAt=(e)=>{ const r=box.getBoundingClientRect(), s=box.clientWidth/720; return {x:(e.clientX-r.left)/s, y:(e.clientY-r.top)/s}; };
  const route=(e)=>{
    const it=e.target.closest('[data-eitem]'); if (it) return ['rclick-'+it.dataset.eitem];
    if (e.target.closest('.epane')) return ['pane-right'];
    if (!e.target.closest('.win7,.sm,.tb,.ctx,.modal7,.dicon,.clockpop')) return ['desk-right'];
    return null;
  };
  box.addEventListener('contextmenu', e=>{ e.preventDefault(); clearTimeout(longT); const r=route(e); if(r) act(r[0], null, rightAt(e)); });
  box.addEventListener('pointerdown', e=>{ if (e.pointerType==='mouse') return; const r=route(e); if(!r) return; const pos=rightAt(e); clearTimeout(longT); longT=setTimeout(()=>{ suppressClick=true; setTimeout(()=>suppressClick=false,700); act(r[0],null,pos); },600); });
  ['pointerup','pointercancel','pointermove'].forEach(ev=>box.addEventListener(ev,e=>{ if(ev!=='pointermove'||Math.abs(e.movementX)+Math.abs(e.movementY)>6) clearTimeout(longT); }));
  box.addEventListener('input', e=>{ const t=e.target; if(t.id==='npad') SIM.noteText=t.value; if(t.id==='rname') SIM.renameVal=t.value; if(t.id==='fname') SIM.fname=t.value; if(t.id==='sstext') SIM.ssText=t.value; });
  box.addEventListener('keydown', e=>{ if(e.key!=='Enter') return; if(e.target.id==='rname'){ e.preventDefault(); act('name'); } if(e.target.id==='fname'){ e.preventDefault(); act('save-ok'); } if(e.target.id==='sstext'){ e.preventDefault(); act('ss-textok'); } });
  new ResizeObserver(()=>box.style.setProperty('--s', box.clientWidth/720)).observe(box);
  stepStart(); lockPromptHeight(); scrollTo(0,0);
}

function onSimClick(e){
  if (suppressClick){ suppressClick=false; return; }
  if (SIM.renaming && !e.target.closest('#rname')){ act('name'); return; }
  if (e.target.matches('input,textarea')) return;
  const ck=e.target.closest('[data-calc]'); if (ck){ act('key-'+ck.dataset.calc, ck); return; }
  const pc=e.target.closest('[data-pc]'); if (pc){ paintColor=pc.dataset.pc; app.querySelectorAll('[data-pc]').forEach(b=>b.classList.toggle('on',b===pc)); return; }
  const ic=e.target.closest('[data-icon]');
  if (ic){ const id=ic.dataset.icon, now=Date.now(), dbl=lastIcon.id===id && now-lastIcon.t<650; lastIcon = dbl?{id:null,t:0}:{id,t:now}; act((dbl?'dbl-':'dsel-')+id, ic); return; }
  const it=e.target.closest('[data-eitem]');
  if (it){ const id=it.dataset.eitem, now=Date.now(), dbl=lastItem.id===id && now-lastItem.t<650; lastItem = dbl?{id:null,t:0}:{id,t:now}; act((dbl?'open-':'sel-')+id, it); return; }
  const el=e.target.closest('[data-act]'); if (!el) return;
  act(el.dataset.act, el);
}
const NEUTRAL = id => id==='desk'||id==='panel'||id.startsWith('focus-')||id.startsWith('dsel-');
function act(id, el, pos){
  if (busy || !M) return;
  const exp=expected();
  if (SIM.os==='saver'){ effect('wake'); if (exp==='wake') advance(); else renderSim(); resetIdle(); return; }
  if (id.startsWith('sel-') && exp!==id && exp && exp.startsWith('open-')===false){
    /* selecting is always allowed */
    const prev=SIM.expSel; SIM.expSel=id.slice(4); clearTrans(); if (prev!==SIM.expSel) renderSim(); resetIdle(); return;
  }
  if (id==='bg-pick' && el){ const now=Date.now(), dbl=lastBg.k===el.dataset.bg && now-lastBg.t<700; lastBg = dbl?{k:null,t:0}:{k:el.dataset.bg,t:now};
    if (dbl){ id='bg-save'; }
    else if (exp && exp!=='bg-pick'){ SIM.bgSel=el.dataset.bg; renderSim(); resetIdle(); if (exp==='bg-save') tip('Good choice! Now click Save changes, or double-click the picture.'); return; } }
  if (NEUTRAL(id)){ if (effect(id,el,pos)!=='skip') renderSim(); resetIdle(); return; }
  if (exp && id!==exp) return mistake(id, el);
  const r=effect(id,el,pos);
  resetIdle();
  if (r===false){ if(exp) M.miss++; renderSim(); return; }
  if (exp===id){ advance(); return; }
  if (r!=='skip') renderSim();
}
function advance(){ M.i++; tone([[600+M.i*60,.12]]); if (M.i>=M.steps.length) return missionDone(); stepStart(); }
function mistake(id, el){
  M.miss++; M.hint=true; oops();

  const again = el && el.dataset && el.dataset.act && app.querySelector(`[data-act="${el.dataset.act}"]`);
  if (again && again.animate) again.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:350});
}
function missionDone(){ clearTimeout(idleT); renderSim(); app.querySelectorAll('#chips .chip').forEach(c=>c.className='chip done'); wrapUp(); }
function wrapUp(){
  const m=M; praise();

  setTimeout(()=>{ if (M!==m) return; stopMusic(); clearTimeout(saverT); finish('sim-'+m.key, m.miss, ()=>startMission(m.key)); M=null; }, m.end?4400:2400);
}

function effect(id, el, pos){
  const s=SIM, fs=s.fs;
  const keepMenus = ['allprog','back','acc','setbg','org','viewdrop','paintmenu','calc-view','clock','ss-drop','start'];
  if (!keepMenus.includes(id) && !NEUTRAL(id)) clearTrans();
  if (id==='desk'){ if (M && !M.free) return 'skip'; if (s.menu||Object.keys(TRANS).some(k=>s[k])){ s.menu=null; clearTrans(); s.sel=null; return; } return 'skip'; }
  if (id==='panel') return 'skip';
  if (id.startsWith('dsel-')){ s.sel=id.slice(5); return; }
  if (id.startsWith('focus-')){ const w=id.slice(6); if (activeWin()===w) return 'skip'; front(w); return; }
  if (id.startsWith('key-')){ calcKey(id.slice(4)); return 'skip'; }
  if (id.startsWith('app-')){ openWin(id.slice(4)); if(id==='app-exp'){ s.cwd='lib'; s.expSel=null; } return; }
  if (id==='dbl-comp'){ s.sel=null; openWin('exp'); s.cwd='comp'; s.expSel=null; return; }
  if (id==='dbl-bin'){ s.sel=null; openWin('bin'); return; }
  if (id==='dbl-cp'){ s.sel=null; openWin('cp'); return; }
  if (id.startsWith('min-')){ const w=findWin(id.slice(4)); if(w){ w.prev=w.state; w.state='min'; } return; }
  if (id.startsWith('max-')){ const w=findWin(id.slice(4)); if(w) w.state='max'; return; }
  if (id.startsWith('restore-')){ const w=findWin(id.slice(8)); if(w) w.state='normal'; return; }
  if (id.startsWith('tb-')){ const w=findWin(id.slice(3)); if(!w) return; if (w.state==='min'){ w.state=w.prev||'normal'; front(w.id); } else if (activeWin()===w.id){ w.prev=w.state; w.state='min'; } else front(w.id); return; }
  if (id.startsWith('x-')){ closeWin(id.slice(2)); return; }
  /* explorer */
  if (id.startsWith('nav-')){ const n=id.slice(4); if (!fs[n]) return 'skip'; s.cwd=n; s.expSel=null; return; }
  if (id.startsWith('sel-')){ s.expSel=id.slice(4); return; }
  if (id.startsWith('open-')){ const n=fs[id.slice(5)]; if(!n) return 'skip'; if (n.kids){ s.cwd=id.slice(5); s.expSel=null; return; }
    const map={txt:'note',rtf:'wordpad',docx:'wordpad',bmp:'paint',png:'paint',mp3:'wmp'}; if (map[n.ext]){ openWin(map[n.ext]); if(n.ext==='mp3'){ s.wmp={folder:'sample',song:+id.slice(6)||0,playing:true}; playSong(s.wmp.song); } return; } tip('This file opens in Microsoft Excel. It is not in this game.'); return 'skip'; }
  if (id.startsWith('rclick-')){ const n=id.slice(7); s.expSel=n; s.ctx={type:'item',id:n,...(pos||{x:300,y:150})}; return; }
  switch(id){
    case 'start': { const was=s.menu; clearTrans(); s.menu = was ? null : 'start'; s.acc=false; return; }
    case 'allprog': s.menu='all'; return;
    case 'back': s.menu='start'; s.acc=false; return;
    case 'acc': s.acc=!s.acc; return;
    case 'sm-docs': openWin('exp'); s.cwd='docs'; s.expSel=null; return;
    case 'sm-music': openWin('exp'); s.cwd='music'; s.expSel=null; return;
    case 'sm-pics': openWin('exp'); s.cwd='pics'; s.expSel=null; return;
    case 'sm-comp': openWin('exp'); s.cwd='comp'; s.expSel=null; return;
    case 'sm-cp': openWin('cp'); return;
    case 'pin-exp': openWin('exp'); if(!findWin('exp')||s.cwd===undefined) s.cwd='lib'; return;
    case 'cp-pers': openWin('pers'); return;
    case 'cp-dt': openWin('dt'); return;
    case 'desk-right': s.menu=null; s.ctx={type:'desk',...(pos||{x:300,y:150})}; return;
    case 'pane-right': s.expSel=null; s.ctx={type:'pane',...(pos||{x:300,y:150})}; return;
    case 'ctx-personalize': openWin('pers'); return;
    case 'ctx-open': return effect('open-'+s.expSel);
    case 'ctx-cut': return effect('org-cut');
    case 'ctx-copy': return effect('org-copy');
    case 'ctx-paste': return effect('org-paste');
    case 'ctx-delete': return effect('org-delete');
    case 'ctx-rename': return effect('org-rename');
    case 'ctx-newfolder': return effect('newf');
    /* personalization */
    case 'pers-bg': s.bgSel=s.bg; openWin('bgwin'); return;
    case 'pers-saver': s.ssSel=s.saver; openWin('ssdlg'); return;
    case 'theme': s.bg=el.dataset.bg; s.bgSel=s.bg; return;
    case 'bg-pick': s.bgSel=el.dataset.bg; return;
    case 'bg-save': if (el && el.dataset && el.dataset.bg) s.bgSel=el.dataset.bg; s.bg=s.bgSel; closeWin('bgwin'); front('pers'); return;
    case 'bg-cancel': closeWin('bgwin'); return;
    case 'ss-drop': { const was=s.ssDrop; clearTrans(); s.ssDrop=!was; return; }
    case 'ss-pick': s.ssSel=el.dataset.ss; if (M && !M.free && s.ssSel==='none'){ tip('Choose a screen saver, not (None).'); return false; } return;
    case 'ss-up': s.wait=Math.min(60,s.wait+1); return;
    case 'ss-down': s.wait=Math.max(1,s.wait-1); return;
    case 'ss-check': s.ssResume=!s.ssResume; return;
    case 'ss-settings': if (s.ssSel==='text3d'){ s.ssSetText=true; return; } tip(s.ssSel==='none'?'First choose a screen saver.':'This screen saver has no settings in this game. Try 3D Text!'); return 'skip';
    case 'ss-textok': s.ssSetText=false; return;
    case 'ss-preview': if (s.ssSel==='none'){ tip('First choose a screen saver.'); return 'skip'; } s.preview=true; s.os='saver'; return;
    case 'ss-apply': s.saver=s.ssSel; return;
    case 'ss-ok': s.saver=s.ssSel; closeWin('ssdlg'); front('pers'); return;
    case 'ss-cancel': closeWin('ssdlg'); return;
    case 'wake': { const prev=s.preview; s.preview=false; s.os = (!prev && s.ssResume) ? 'locked' : 'desktop'; return; }
    case 'unlock': s.os='desktop'; return;
    /* date and time */
    case 'clock': { const was=s.clockpop; clearTrans(); s.clockpop=!was; return; }
    case 'dt-open': openWin('dt'); return;
    case 'dt-change': s.dtSet=true; s.dtTemp=new Date(Date.now()+s.clockOffset); return;
    case 'dt-day': { const d=new Date(s.dtTemp); d.setDate(+el.dataset.d); s.dtTemp=d; return; }
    case 'dt-prev': { const d=new Date(s.dtTemp); d.setMonth(d.getMonth()-1); s.dtTemp=d; return; }
    case 'dt-next': { const d=new Date(s.dtTemp); d.setMonth(d.getMonth()+1); s.dtTemp=d; return; }
    case 'dt-hup': { const d=new Date(s.dtTemp); d.setHours(d.getHours()+1); s.dtTemp=d; return; }
    case 'dt-hdown': { const d=new Date(s.dtTemp); d.setHours(d.getHours()-1); s.dtTemp=d; return; }
    case 'dt-ok': s.clockOffset=s.dtTemp-Date.now(); s.dtSet=false; return;
    case 'dt-cancel': s.dtSet=false; return;
    case 'dt-ok2': closeWin('dt'); return;
    /* paint */
    case 'draw': return;
    case 'paintmenu': { const was=s.paintMenu; clearTrans(); s.paintMenu=!was; return; }
    case 'p-save': s.saveDlg=true; s.fname=''; focusName=true; return;
    case 'save-ok': { const n=(s.fname||'').trim(); if (!n){ tip('Type a name for your picture first.'); return false; } s.paintName=n.replace(/\.png$/i,'')+'.png'; s.saveDlg=false; const fid='pic_'+(++uid); fs[fid]={name:s.paintName,type:'file',ext:'png',parent:'pics',size:'36 KB'}; fs.pics.kids.push(fid); return; }
    case 'save-cancel': s.saveDlg=false; return;
    case 'setbg': if (!s.paintName){ tip('First save your picture with a name.'); oops(); return false; } s.paintMenu=true; s.paintSet=!s.paintSet; return;
    case 'bg-fill': case 'bg-tile': case 'bg-center': s.customBg=getPaint().toDataURL('image/jpeg',.85); bgVar('custom', s.customBg); s.bg='custom'; s.bgMode=id.slice(3); return;
    /* explorer actions */
    case 'org': { const was=s.orgMenu; clearTrans(); s.orgMenu=!was; return; }
    case 'viewdrop': { const was=s.viewMenu; clearTrans(); s.viewMenu=!was; return; }
    case 'view-large': case 'view-medium': case 'view-list': case 'view-details': s.view=id.slice(5); return;
    case 'newf': {
      if (!fs[s.cwd] || fs[s.cwd].type==='lib' || fs[s.cwd].type==='comp'){ tip('First click Documents in the left pane.'); oops(); return false; }
      let nm='New folder', k=2; while (fs[s.cwd].kids.some(c=>fs[c].name===nm)) nm='New folder ('+(k++)+')';
      const nid='nf_'+(++uid); fs[nid]={name:nm,type:'folder',parent:s.cwd,kids:[]}; fs[s.cwd].kids.push(nid);
      s.expSel=nid; s.renaming=nid; s.renameVal=nm; focusName=true; return; }
    case 'org-rename': if (!s.expSel){ tip('First select a file or folder.'); oops(); return false; } s.renaming=s.expSel; s.renameVal=fs[s.expSel].name; focusName=true; return;
    case 'name': { if (!s.renaming) return 'skip'; const v=(s.renameVal||'').trim(); if (v) fs[s.renaming].name=v; s.renaming=null; return; }
    case 'org-delete': if (!s.expSel){ tip('First select the file or folder to delete.'); oops(); return false; } s.confirm=s.expSel; return;
    case 'yes': { const n=s.confirm; if(!n) return 'skip'; const p=fs[fs[n].parent]; p.kids=p.kids.filter(k=>k!==n); s.binItems.push(n); s.confirm=null; s.expSel=null; tone([[300,.1],[200,.15]]); return; }
    case 'no': s.confirm=null; return;
    case 'org-cut': case 'org-copy': if (!s.expSel){ tip('First select the file or folder.'); oops(); return false; } s.clip={id:s.expSel,mode:id.slice(4)}; say(id==='org-cut'?'Cut':'Copied'); return;
    case 'org-paste': {
      if (!s.clip){ tip('First cut or copy something.'); oops(); return false; }
      const dest=s.cwd, d=fs[dest]; if (!d || !d.kids || d.type==='lib' || d.type==='comp'){ tip('Open a folder first, then paste.'); oops(); return false; }
      const src=s.clip.id; if (isInside(dest, src)){ tip('You cannot paste a folder inside itself.'); oops(); return false; }
      if (s.clip.mode==='cut'){ const p=fs[fs[src].parent]; p.kids=p.kids.filter(k=>k!==src); fs[src].parent=dest; d.kids.push(src); s.expSel=src; s.clip=null; }
      else { const nid=cloneNode(src,dest); d.kids.push(nid); s.expSel=nid; }
      yay(); return; }
    case 'org-close': closeWin('exp'); return;
    /* calculator */
    case 'calc-view': { const was=s.calcView; clearTrans(); s.calcView=!was; return; }
    case 'calc-sci': s.calcSci=true; return;
    case 'calc-std': s.calcSci=false; return;
    /* media player */
    case 'wmp-sample': s.wmp.folder='sample'; return;
    case 'wmp-song': s.wmp.song=+el.dataset.s; if (s.wmp.playing) playSong(s.wmp.song); return;
    case 'wmp-play': if (s.wmp.song===null){ if(s.wmp.folder){ s.wmp.song=0; } else { tip('First open Sample Music and click a song.'); oops(); return false; } } s.wmp.playing=!s.wmp.playing; if (s.wmp.playing) playSong(s.wmp.song); else stopMusic(); return;
    case 'wmp-stop': s.wmp.playing=false; stopMusic(); return;
    case 'wmp-next': if (s.wmp.song!==null){ s.wmp.song=(s.wmp.song+1)%3; if(s.wmp.playing) playSong(s.wmp.song); } return;
    case 'wmp-prev': if (s.wmp.song!==null){ s.wmp.song=(s.wmp.song+2)%3; if(s.wmp.playing) playSong(s.wmp.song); } return;
    case 'wp-pic': s.wpPic=true; return;
    case 'shut': s.menu=null; busy=true; s.os='shutting'; renderSim(); setTimeout(()=>{ busy=false; s.os='off'; s.wins=[]; stopMusic(); renderSim(); },2400); return 'skip';
    case 'poweron': s.os='booting'; busy=true; renderSim(); setTimeout(()=>{ busy=false; s.os='desktop'; renderSim(); resetIdle(); },2600); return 'skip';
    default: return 'skip';
  }
}

function calcKey(k){
  const c=calc, num=v=>parseFloat(v), set=v=>{ c.cur=String(Math.round(v*1e10)/1e10); c.fresh=true; };
  const run=()=>{ const a=c.acc, b=num(c.cur); let r=b; if(c.op==='+')r=a+b; if(c.op==='-')r=a-b; if(c.op==='×')r=a*b; if(c.op==='÷')r=b===0?0:a/b; return Math.round(r*1e10)/1e10; };
  if (/^\d$/.test(k)){ c.cur=(c.fresh||c.cur==='0')?k:(c.cur.length<14?c.cur+k:c.cur); c.fresh=false; }
  else if (k==='.'){ if(c.fresh){c.cur='0.';c.fresh=false;} else if(!c.cur.includes('.')) c.cur+='.'; }
  else if (k==='C'){ calc={cur:'0',acc:null,op:null,fresh:true}; }
  else if (k==='π') set(Math.PI);
  else if (k==='x²') set(num(c.cur)**2);
  else if (k==='x³') set(num(c.cur)**3);
  else if (k==='±') { c.cur=String(-num(c.cur)); }
  else if (k==='√') set(Math.sqrt(Math.max(0,num(c.cur))));
  else if (k==='1/x') set(num(c.cur)===0?0:1/num(c.cur));
  else if (k==='%') set(num(c.cur)/100);
  else if (k==='='){ if(c.op!==null){ c.cur=String(run()); c.op=null; c.acc=null; c.fresh=true; } }
  else { if(c.op!==null && !c.fresh) c.cur=String(run()); c.acc=num(c.cur); c.op=k; c.fresh=true; }
  tone([[500+Math.random()*200,.05]]); say(k==='×'?'times':k==='÷'?'divide':k==='+'?'plus':k==='-'?'minus':k==='C'?'clear':k==='π'?'pi':k==='='?'equals '+calc.cur:k);
  const d=app.querySelector('#cdisp'); if(d) d.textContent=calc.cur;
}
function getPaint(){
  if (paintCanvas) return paintCanvas;
  const c=document.createElement('canvas'); c.width=520; c.height=250; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,520,250); x.lineCap='round'; x.lineJoin='round';
  let down=false, lx=0, ly=0;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener('pointerdown',e=>{ e.stopPropagation(); down=true; [lx,ly]=pos(e); try{c.setPointerCapture(e.pointerId);}catch(_){} x.fillStyle=paintColor; x.beginPath(); x.arc(lx,ly,5,0,7); x.fill(); });
  c.addEventListener('pointermove',e=>{ if(!down) return; const [nx,ny]=pos(e); x.strokeStyle=paintColor; x.lineWidth=paintColor==='#FFFFFF'?24:10; x.beginPath(); x.moveTo(lx,ly); x.lineTo(nx,ny); x.stroke(); lx=nx; ly=ny; });
  const up=()=>{ if(!down) return; down=false; SIM.paintStrokes++; if (expected()==='draw' && SIM.paintStrokes>=1) setTimeout(()=>act('draw'),500); };
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
  return paintCanvas=c;
}

function monthGrid(d, act, sel){
  const y=d.getFullYear(), m=d.getMonth(), first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  let cells=['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<b>${x}</b>`).join('');
  for (let i=0;i<first;i++) cells+='<span></span>';
  for (let k=1;k<=n;k++) cells+= act ? `<button data-act="${act}" data-d="${k}" class="${k===sel?'on':''}">${k}</button>` : `<span class="${k===sel?'on':''}">${k}</span>`;
  return `<div class="mgrid">${cells}</div>`;
}
function analog(d, size){
  const h=d.getHours()%12, m=d.getMinutes(), ha=(h+m/60)*30, ma=m*6;
  const hand=(a,len,w,c)=>`<line x1="50" y1="50" x2="${50+len*Math.sin(a*Math.PI/180)}" y2="${50-len*Math.cos(a*Math.PI/180)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#9cc3ea" stroke-width="5"/>${[...Array(12)].map((_,k)=>`<circle cx="${50+38*Math.sin(k*Math.PI/6)}" cy="${50-38*Math.cos(k*Math.PI/6)}" r="2.5" fill="#16305A"/>`).join('')}${hand(ha,22,5,'#16305A')}${hand(ma,32,3.5,'#16305A')}<circle cx="50" cy="50" r="4" fill="#F2562B"/></svg>`;
}

  const details = s.view==='details' && cur.type!=='lib' && cur.type!=='comp';
  const VIEWS=[['noop','Extra Large Icons'],['view-large','Large Icons'],['view-medium','Medium Icons'],['noop','Small Icons'],['view-list','List'],['view-details','Details'],['noop','Tiles'],['noop','Content']];

function renderSim(){
  const box=app.querySelector('#simbox'); if(!box) return;
  box.innerHTML = deskHTML();
  box.style.setProperty('--s', box.clientWidth/720);
  const slot=box.querySelector('.paintSlot'); if (slot) slot.appendChild(getPaint());
  if (focusName){ const f=box.querySelector('#rname')||box.querySelector('#fname'); if (f){ f.focus(); f.select(); focusName=false; } }
  else { const r=box.querySelector('#rname'); if (r){ r.focus(); const v=r.value; r.setSelectionRange(v.length,v.length); } }
  const ss=box.querySelector('#sstext'); if (ss) ss.focus();
  app.querySelectorAll('.hint').forEach(el=>el.classList.remove('hint'));
  const exp=expected();
  if (M && M.hint && exp){
    const els=[...app.querySelectorAll('[data-act],[data-hint]')].filter(el=>{ const hs=(el.dataset.hint||'').split(' '); return el.dataset.act===exp || hs.includes(exp); });
    const one=['dt-day','ss-pick','bg-pick','wmp-song'].includes(exp);
    (one ? els.filter(e=>e.dataset.ss!=='none' && e.dataset.bg!==SIM.bgSel).slice(0,1) : els).forEach(el=>el.classList.add('hint'));
  }
}

const scoreId = g => g;

let curTopic = null;
const md = t => t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain = t => t.replace(/\*\*/g,'');
const itemVoice = it => plain(it.en) + (it.steps ? ' ' + it.steps.map(s=>s[0]).join(', then ') + '.' : '') + (it.after?' '+it.after:'');
const backBtn = () => curTopic===null ? '' : `<button class="backbtn" data-back="1">‹ Lesson</button>`;
document.addEventListener('click', e=>{ if (e.target.closest('[data-back]')){ M=null; clearTimeout(idleT); viewTopic(curTopic); } });

function bookViewer(pages){
  let i=0;
  const html = `<div class="viewer" id="viewer">
    <div class="vimg"><img id="vimg" src="${pageImg(pages[0])}" alt="Book page ${pages[0]}"></div>
    <div class="vbar"><button class="vnav" id="vprev" aria-label="Previous page">‹</button><span id="vlab"></span><button class="vnav" id="vnext" aria-label="Next page">›</button><button class="vzoom" id="vzoom">Make it big</button></div></div>`;
  const wire = () => {
    const img=app.querySelector('#vimg'), lab=app.querySelector('#vlab');
    const draw=()=>{ img.src=pageImg(pages[i]); img.alt='Book page '+pages[i]; lab.textContent=`Page ${pages[i]}`+(pages.length>1?`  (${i+1} of ${pages.length})`:''); app.querySelector('#vprev').disabled=i===0; app.querySelector('#vnext').disabled=i===pages.length-1; };
    app.querySelector('#vprev').onclick=()=>{ if(i>0){i--;draw();} };
    app.querySelector('#vnext').onclick=()=>{ if(i<pages.length-1){i++;draw();} };
    app.querySelector('#vzoom').onclick=()=>openBook(pages.slice(i).concat(pages.slice(0,i)));
    draw();
  };
  return {html, wire};
}

function viewTopic(t){
  curTopic=t; const T=TOPICS[t]; S.learned[t]=1; save();
  const v=bookViewer(T.pages);
  const gameTiles = T.games.map(g=>{ const G=GAMEDEF[g]; return `<button class="tile" data-play="${g}"><span class="ico ${G.c}">${G.ico}</span><span class="t">${G.t}</span><span class="s">${G.s}</span>${starRow(S.best[scoreId(g)]||0)}</button>`; }).join('');
  app.innerHTML = `
  <div class="topichead">
    <span class="tnum ${T.color}">${t+1}</span>
    <div class="ttext"><span class="eyebrow">Topic ${t+1} of ${TOPICS.length}</span><h2>${T.title}</h2></div>
    ${sayBtn(T.title)}
  </div>
  <div class="tdots">${TOPICS.map((x,k)=>`<button class="${k===t?'on':S.learned[k]?'seen':''}" data-t="${k}" aria-label="${x.title}"><span>${k+1}</span></button>`).join('')}</div>

  <section class="part"><div class="partlabel"><span class="pn">A</span>Read the book</div>${v.html}</section>

  <section class="part"><div class="partlabel"><span class="pn">B</span>What the book says <button class="listenall" id="all">${SV.speaker} Listen to all</button></div>
    <div class="summary">${T.items.map((it,k)=>`<div class="sitem" data-i="${k}">
      <div class="spic">${it.pic}</div>
      <div class="stext"><p>${md(it.en)}</p>
        ${it.steps?`<div class="ssteps">${it.steps.map((s,j)=>`${j?'<span class="arrow">➜</span>':''}<span class="sstep">${s[1]||""}<span>${s[0]}</span></span>`).join('')}</div>`:''}
        ${it.after?`<p class="after">${it.after}</p>`:''}<div class="ar">${it.ar}</div><span class="src">From the book · ${it.src}</span></div>
      ${sayBtn(itemVoice(it))}
    </div>`).join('')}</div>
  </section>

  <section class="part"><div class="partlabel"><span class="pn">C</span>Play</div><div class="tiles">${gameTiles}</div></section>

  <div class="navrow">
    ${t>0?`<button class="btn alt" id="tprev">‹ ${TOPICS[t-1].title}</button>`:'<span></span>'}
    ${t<TOPICS.length-1?`<button class="btn" id="tnext">${TOPICS[t+1].title} ›</button>`:`<button class="btn" id="tdone">Finish ★</button>`}
  </div>`;
  v.wire();
  say(T.title);
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>viewTopic(+b.dataset.t));
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{ tone([[880,.08]]); GAMEDEF[b.dataset.play].go(); scrollTo(0,0); });
  app.querySelector('#all').onclick=()=>{
    const list=T.items; let k=0; if(!S.sound) return;
    try{ speechSynthesis.cancel(); }catch(e){}
    const next=()=>{ app.querySelectorAll('.sitem').forEach(x=>x.classList.toggle('reading', +x.dataset.i===k)); if(k>=list.length) return;
      try{ const u=new SpeechSynthesisUtterance(itemVoice(list[k])); u.lang='en-US'; u.rate=.8; u.onend=()=>{k++;next();}; speechSynthesis.speak(u);}catch(e){} };
    next();
  };
  const p=app.querySelector('#tprev'); if(p) p.onclick=()=>viewTopic(t-1);
  const n=app.querySelector('#tnext'); if(n) n.onclick=()=>{ tone([[880,.08]]); viewTopic(t+1); };
  const d=app.querySelector('#tdone'); if(d) d.onclick=()=>{ confetti(); yay(); say('You finished the chapter! Great job!'); viewHome(); };
  scrollTo(0,0);
}

/* ---------- HOME ---------- */
const starRow = n => `<div class="stars">${[1,2,3].map(k=>`<i class="${k<=n?'on':''}">★</i>`).join('')}</div>`;
function viewHome(){
  curTopic=null; M=null; clearTimeout(idleT);
  app.innerHTML = `
  <section class="hero">${SV.bee.replace('<svg','<svg class="bee"')}<div><h1>Using Windows</h1><p>Read the book, learn, then do it yourself on Windows 7. Win stars in every topic! ${sayBtn("Using Windows! Read the book, learn, then do it yourself on Windows 7. Win stars in every topic!")}</p><div class="ar">اقرأ الكتاب، تعلّم، ثم العب واجمع النجوم في كل درس!</div></div></section>
  <div class="path">${TOPICS.map((T,k)=>{ const got=T.games.reduce((a,g)=>a+(S.best[scoreId(g)]||0),0), max=T.games.length*3;
    return `<button class="tile ptile" data-t="${k}"><span class="ico ${T.color}">${T.ico}</span><span class="eyebrow">Topic ${k+1}</span><span class="t">${T.title}</span><span class="s">Pages ${T.pages.join(', ')}</span><span class="pstars"><b>★</b> ${got} / ${max}</span></button>`; }).join('')}</div>
  <div class="row" style="margin-top:18px"><button class="viewbtn" data-book="${PAGES.join(',')}">${SV.book.replace('<svg','<svg width="20" height="20" style="vertical-align:-4px"')} See all book pages</button><button class="viewbtn" data-free="1">Free play on Windows</button></div>
  <button class="reset" id="reset">Start again (clear my stars)</button>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tone([[880,.08]]); viewTopic(+b.dataset.t); });
  app.querySelector('[data-free]').onclick=()=>startMission('free');
  const r=app.querySelector('#reset'); r.onclick=()=>{
    if (r.dataset.sure){ S.learned={}; S.best={}; save(); viewHome(); } else { r.dataset.sure=1; r.textContent='Tap again to clear all stars'; }
  };
  scrollTo(0,0);
}

/* ---------- header toggles ---------- */
const app=document.getElementById('app');
const arBtn=document.getElementById('arBtn'), sndBtn=document.getElementById('sndBtn');
function applyToggles(){ document.body.classList.toggle('arabic',!!S.arabic); arBtn.setAttribute('aria-pressed',!!S.arabic); sndBtn.setAttribute('aria-pressed',!!S.sound); sndBtn.textContent=S.sound?'Sound on':'Sound off'; }
arBtn.onclick=()=>{ S.arabic=!S.arabic; save(); applyToggles(); };
sndBtn.onclick=()=>{ S.sound=!S.sound; if(!S.sound) try{speechSynthesis.cancel()}catch(e){} save(); applyToggles(); };
document.getElementById('homeBtn').onclick=()=>viewHome();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=document.querySelector('.modal'); if(m) m.remove(); } });
applyToggles(); updateStars(); viewHome();
</script>

/* =====================================================================
   PRACTICAL EXAM MODE
   - the student writes a name, then does every task with NO hints,

   - every result is saved on this computer (teacher page, PIN) and can be

   ===================================================================== */
const EXK = 'ict-exam-results-v1', EXSET = 'ict-exam-settings-v1';
let EXMEM = null; /* used only if this browser blocks saving */
function exAll(){ try { return JSON.parse(localStorage.getItem(EXK)||'[]'); } catch(e){ return EXMEM||(EXMEM=[]); } }
function exWrite(a){ try { localStorage.setItem(EXK, JSON.stringify(a)); return true; } catch(e){ EXMEM=a; return false; } }
function exSettings(){ let o={}; try { o=JSON.parse(localStorage.getItem(EXSET)||'{}'); } catch(e){} o=Object.assign({pin:'',sheet:''}, o); if (!o.sheet && typeof QUIZ_SETTINGS!=='undefined') o.sheet=QUIZ_SETTINGS.sheet||''; return o; }
/* ---------- quiz days and times ---------- */
const EXDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EXDAYS_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function exSlots(){ return (typeof QUIZ_SETTINGS!=='undefined' && QUIZ_SETTINGS.schedule && QUIZ_SETTINGS.schedule[EXAM.grade]) || []; }
const exMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+(m||0); };
const exYmd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function exSlotOn(sl, d){ return sl.date ? sl.date===exYmd(d) : (sl.days||[]).includes(d.getDay()); }
function exOpenSlot(now=new Date()){ const m=now.getHours()*60+now.getMinutes(); return exSlots().find(sl=>exSlotOn(sl,now) && m>=exMin(sl.from) && m<exMin(sl.to)) || null; }
function exOpenNow(now=new Date()){ const L=exSlots(); if (!L.length) return true; const m=now.getHours()*60+now.getMinutes(); return L.some(sl=>exSlotOn(sl,now) && m>=exMin(sl.from) && m<exMin(sl.to)); }
function exNextOpen(now=new Date()){ const L=exSlots(); const m=now.getHours()*60+now.getMinutes(); let best=null;
  for (let k=0;k<370 && !best;k++){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k);

function cut(key, from, to){
  const D=MISSIONS[key]; if (to==null) to=D.steps.length;
  if (to===D.steps.length) return key;
  const k=`${key}@${to}`;
  if (!MISSIONS[k]){ const c=Object.assign({},D,{steps:D.steps.slice(0,to)}); delete c.waitFor; delete c.end; MISSIONS[k]=c; }
  return k;
}
const exMax = it => it.type==='sim' ? MISSIONS[it.key].steps.length - (it.from||0) : 1;
/* A new exam every time: one task from every book topic (whole task, or only its last steps),
   then "find it on the desktop" tasks until the exam is exactly 25 marks. Then mix the order. */
function exBuild(){
  const P = EXAM.pool();
  for (let tries=0; tries<3000; tries++){
    const pick = P.topics.map(v=>v[Math.floor(Math.random()*v.length)]);
    const sum = pick.reduce((a,it)=>a+exMax(it),0), need = EXTOTAL-sum;
    if (need < P.minFind || need > Math.min(P.maxFind, P.find.length)) continue;
    const items = shuffle(pick.concat(shuffle(P.find).slice(0,need))).map(it=>Object.assign({},it));
    items.forEach((it,k)=>{ it.n=k+1; it.max=exMax(it); });
    return items;
  }
  throw new Error('exam pool cannot make '+EXTOTAL+' marks');
}

/* ---------- simulation tasks: the real simulation, with the exam rules ---------- */
const _act = act;
act = function(id, el, pos){
  /* a fast second click on the button that was just right is not counted as a mistake */
  if (M && id===EX.lastOk.id && id!=='bg-pick' && Date.now()-EX.lastOk.t<700) return;
  const m=M, before = m ? m.i : 0;
  if (m && !busy && EXAM.free && EXAM.free.includes(id) && typeof expected==='function' && expected()!==id){ effect(id, el, pos); renderSim(); return; }
  const r = _act(id, el, pos);
  if (m && m.i>before) EX.lastOk={id, t:Date.now()};
  return r;
};
function exLog(m, upTo){
  m._log = m._log||[]; m._base = m._base||0;
  while (m._log.length < upTo){ m._log.push(m.miss - m._base); m._base = m.miss; }
}
stepStart = function(){
  if (!M) return;
  M.hint=false; clearTimeout(idleT);
  exLog(M, M.i);
  const t=app.querySelector('#mtxt');
  if (t && EX.item){ t.textContent=EX.item.q; const a=app.querySelector('#mar'); if(a) a.textContent=EX.item.ar||''; const c=app.querySelector('#chips'); if(c) c.innerHTML=''; }
  renderSim();
  if (typeof resetIdle==='function') resetIdle();
};
wrapUp = function(){
  const m=M; clearTimeout(idleT); exLog(m, m.steps.length);
  if (typeof stopMusic==='function') stopMusic();
  let wait=1300;
  if (m.key.startsWith('saver') && SIM.saver && SIM.saver!=='none'){ if (typeof saverT!=='undefined') clearTimeout(saverT); SIM.os='saver'; renderSim(); wait=3500; }
  EX.timers.push(setTimeout(()=>{ if (M!==m) return; if (typeof saverT!=='undefined') clearTimeout(saverT); M=null; exSimEnd(m,false); }, wait));
};
function exSimEnd(m, skipped){
  exLog(m, m.i);
  const got = m._log.slice(m._from||0, m.steps.length).filter(x=>x===0).length;
  const wrong = m.miss;
  exRecord({got, wrong, skipped, done:m.i, of:m.steps.length});
}

function exBegin(name, cls){
  if (!exOpenNow()){ exWelcome(); return; }
  const now=new Date();
  ITEMS = exBuild(); EXMAX = ITEMS.reduce((a,it)=>a+it.max,0);
  EX.rec = { id: now.getTime().toString(36)+Math.random().toString(36).slice(2,6), grade:EXAM.grade, exam:EXAM.title+' — '+EXAM.sub,
    name, cls, start:now.toISOString(), end:null, status:'in progress', score:0, max:EXMAX, items:[], sent:false };
  const all=exAll(); all.push(EX.rec); exWrite(all);
  EXON=true; EX.i=0; exPill(); exShow();
}
function exSaveRec(){ const all=exAll(), k=all.findIndex(r=>r.id===EX.rec.id); if(k<0) all.push(EX.rec); else all[k]=EX.rec; exWrite(all); }
function exClear(){ EX.timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); EX.timers=[]; SIMT.forEach(clearTimeout); SIMT.clear(); if (typeof busy!=='undefined') busy=false; clearTimeout(idleT); if (typeof saverT!=='undefined') clearTimeout(saverT); if (typeof stopMusic==='function') stopMusic(); }

function exShow(){

  const it=EX.item;
  EX.rec.items[EX.i] = { n:it.n, task:it.title||it.q, type:it.type, got:r.got, max:it.max, wrong:r.wrong||0, skipped:!!r.skipped,

  EX.rec.score = EX.rec.items.reduce((a,x)=>a+(x?x.got:0),0);

/* 1. simulation task */
function exSim(it){
  startMission(it.key);
  app.classList.add('ex-sim');
  app.querySelectorAll('.viewhead,#mhelp,.simtools').forEach(x=>x.remove());
  app.insertAdjacentHTML('afterbegin', exTop(true));
  const mb=app.querySelector('.mbar');
  const ms=app.querySelector('#msay'); if (ms){ ms.onclick=null; ms.setAttribute('data-exsay', it.q); }
  exWireSkip(()=>{ const m=M; if(!m) return; M=null; exClear(); exLog(m, m.i); exSimEnd(m,true); });
  if (it.from){
    for (let k=0; k<it.from && M; k++){
      const id=M.steps[k][0];
      const el=app.querySelector(`#simbox [data-act="${id}"]:not([data-ss="none"])`);
      _act(id, el);
    }
    if (M){ M._log=Array(it.from).fill(-1); M._base=M.miss=0; M._from=it.from; renderSim(); }
  }
  EX.timers.push(setTimeout(()=>speak(it.q), 300));
  scrollTo(0,0);
}

/* find a part of the desktop on the simulated computer: the first tap is the answer */
MISSIONS.__desk = {title:'Desktop', page:[], start:'desk', steps:[['__none','','','']]};
function exFind(it){
  startMission('__desk');
  app.classList.add('ex-sim');
  app.querySelectorAll('.viewhead,#mhelp,.simtools').forEach(x=>x.remove());
  app.insertAdjacentHTML('afterbegin', exTop(false));
  const ms=app.querySelector('#msay'); if (ms){ ms.onclick=null; ms.setAttribute('data-exsay', it.q); }
  const box=app.querySelector('#simbox'); let done=false;
  const stop=e=>{ e.stopPropagation(); e.preventDefault(); };
  ['contextmenu','pointerdown','dblclick'].forEach(ev=>box.addEventListener(ev, stop, true));
  box.addEventListener('click', e=>{
    stop(e); if (done) return; done=true;
    /* hit test by position, so parts drawn on top (like gadgets) count too */
    const x=e.clientX, y=e.clientY, inside=sel=>[...box.querySelectorAll(sel)].some(el=>{ const r=el.getBoundingClientRect(); return r.width>0 && x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; });
    const hit = inside(it.sel) && !(it.not && inside(it.not));
    const r=box.getBoundingClientRect(), d=document.createElement('div'); d.className='ex-dot';
    d.style.left=(e.clientX-r.left)+'px'; d.style.top=(e.clientY-r.top)+'px'; box.appendChild(d); tick();
    EX.timers.push(setTimeout(()=>{ M=null; exRecord({got:hit?1:0, answer:hit?'right place':'other place'}); }, 650));
  }, true);
  EX.timers.push(setTimeout(()=>speak(it.q), 300));
  scrollTo(0,0);
}

/* ---------- send a finished result to the teacher's Google Sheet (optional) ---------- */
function exRow(r){
  const d=new Date(r.start), mins=r.end?Math.max(1,Math.round((new Date(r.end)-d)/60000)):'';
  return { date:d.toLocaleDateString('en-GB'), time:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), grade:r.grade, name:r.name, cls:r.cls,
    score:r.score, max:r.max, pct:Math.round(r.score/r.max*100), minutes:mins, status:r.status,
    details:r.items.filter(Boolean).map(x=>`${x.n}. ${x.task.replace(/<[^>]+>/g,'')}: ${x.got}/${x.max}${x.skipped?' (skipped)':''}`).join(' | '), id:r.id };
}
function exSend(r){
  const url=exSettings().sheet; if (!url || r.status!=='finished') return Promise.resolve(false);
  return fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(exRow(r))})
    .then(()=>{ const all=exAll(), k=all.findIndex(x=>x.id===r.id); if(k>=0){ all[k].sent=true; exWrite(all); } return true; })
    .catch(()=>false);
}

}
const tpDate = iso => { const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const tpMins = r => r.end ? Math.max(1,Math.round((new Date(r.end)-new Date(r.start))/60000))+' min' : '—';
function tpRows(){
  const q=tpFilter.q.toLowerCase();
  return exAll().filter(r=>(tpFilter.grade==='all'||String(r.grade)===tpFilter.grade)&&(tpFilter.status==='all'||(tpFilter.status==='done'?r.status==='finished':r.status!=='finished'))&&(!q||(r.name+' '+(r.cls||'')).toLowerCase().includes(q)))
    .sort((a,b)=>b.start.localeCompare(a.start));
}
function tpList(){
  const B=TP.querySelector('#tpB'), rows=tpRows(), fin=rows.filter(r=>r.status==='finished');
  const avg = fin.length ? Math.round(fin.reduce((a,r)=>a+r.score/r.max*100,0)/fin.length) : 0;
  const best = fin.length ? Math.max(...fin.map(r=>Math.round(r.score/r.max*100))) : 0;
  const unsent = exAll().filter(r=>r.status==='finished'&&!r.sent).length, sheet=exSettings().sheet;
  const pc = p => p>=75?'#2f8f1f':p>=50?'#1C83E0':'#e08a00';
  B.innerHTML=`
  <div class="tp-bar">
    <select id="tpG"><option value="all">All grades</option>${[1,2,3].map(g=>`<option value="${g}" ${tpFilter.grade==String(g)?'selected':''}>Grade ${g}</option>`).join('')}</select>
    <select id="tpS"><option value="all">All results</option><option value="done" ${tpFilter.status==='done'?'selected':''}>Finished</option><option value="wip" ${tpFilter.status==='wip'?'selected':''}>Not finished</option></select>
    <input id="tpQ" placeholder="Search name or class" value="${exEsc(tpFilter.q)}" style="flex:1;min-width:160px">
    <button class="tp-btn g" id="tpCsv">⬇ Excel (CSV)</button><button class="tp-btn l" id="tpPrint">🖨 Print</button><button class="tp-btn l" id="tpSet">⚙ Settings</button>
  </div>
  <div class="tp-stats">
    <div class="tp-stat"><span>Students</span><b>${rows.length}</b></div>
    <div class="tp-stat"><span>Finished</span><b>${fin.length}</b></div>
    <div class="tp-stat"><span>Average mark</span><b>${fin.length?avg+'%':'—'}</b></div>
    <div class="tp-stat"><span>Best mark</span><b>${fin.length?best+'%':'—'}</b></div>
  </div>
  ${sheet&&unsent?`<div class="ex-warn noprint" style="margin:0 0 12px">${unsent} result(s) are not in your Google Sheet yet. <button class="tp-btn" id="tpResend">Send now</button></div>`:''}
  ${rows.length?`<div class="tp-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Class</th><th>Grade</th><th class="num">Mark</th><th class="num">%</th><th>Time</th><th>Status</th><th class="noprint"></th></tr></thead><tbody>
    ${rows.map(r=>{ const p=Math.round(r.score/r.max*100); return `<tr class="tp-row" data-id="${r.id}"><td>${tpDate(r.start)}</td><td><b>${exEsc(r.name)}</b></td><td>${exEsc(r.cls||'')}</td><td>${r.grade}</td>
      <td class="num"><b>${r.score}</b> / ${r.max}</td><td class="num">${p}%<span class="pctbar"><i style="width:${p}%;background:${pc(p)}"></i></span></td><td>${tpMins(r)}</td>
      <td><span class="tag ${r.status==='finished'?'ok':'wip'}">${r.status==='finished'?'Finished':'Not finished'}</span></td>
      <td class="noprint"><button class="tp-btn l" data-del="${r.id}" title="Delete this result">🗑</button></td></tr>
      <tr class="det" data-det="${r.id}" style="display:${tpOpenRow===r.id?'table-row':'none'}"><td colspan="9"><ol>${r.items.filter(Boolean).map(x=>`<li><span class="${x.got===x.max?'y':'n'}">${x.got}/${x.max}</span> ${exEsc(x.task.replace(/<[^>]+>/g,''))}${x.type==='sim'&&x.wrong?` <span class="tp-note">(${x.wrong} wrong click${x.wrong>1?'s':''})</span>`:''}${x.skipped?' <span class="tp-note">(skipped)</span>':''}${x.type!=='sim'&&!x.got&&x.answer?` <span class="tp-note">(chose: ${exEsc(x.answer)})</span>`:''} <span class="tp-note">· ${x.sec}s</span></li>`).join('')||'<li>No answers yet.</li>'}</ol></td></tr>`; }).join('')}
  </tbody></table></div>`:`<div class="tp-empty">No results yet. When a student finishes the quiz on this computer, the mark appears here.</div>`}
  <p class="tp-note noprint" style="margin-top:12px">Click a student to see every task. Results are saved in this browser on this computer${sheet?' and sent to your Google Sheet':''}.</p>`;
  B.querySelector('#tpG').onchange=e=>{ tpFilter.grade=e.target.value; tpList(); };
  B.querySelector('#tpS').onchange=e=>{ tpFilter.status=e.target.value; tpList(); };
  const qi=B.querySelector('#tpQ'); qi.oninput=()=>{ tpFilter.q=qi.value; const pos=qi.selectionStart; tpList(); const n=TP.querySelector('#tpQ'); n.focus(); n.setSelectionRange(pos,pos); };
  B.querySelector('#tpCsv').onclick=()=>tpCsv(rows);
  B.querySelector('#tpPrint').onclick=()=>print();
  B.querySelector('#tpSet').onclick=tpSettings;
  const rs=B.querySelector('#tpResend'); if(rs) rs.onclick=()=>{ rs.disabled=true; rs.textContent='Sending…'; Promise.all(exAll().filter(r=>r.status==='finished'&&!r.sent).map(exSend)).then(tpList); };
  B.querySelectorAll('tr.tp-row').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('[data-del]')) return; const id=tr.dataset.id; tpOpenRow = tpOpenRow===id?null:id; const d=B.querySelector(`[data-det="${id}"]`); B.querySelectorAll('tr.det').forEach(x=>{ if(x!==d) x.style.display='none'; }); d.style.display = tpOpenRow===id?'table-row':'none'; });
  B.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('r')){ b.classList.add('r'); b.classList.remove('l'); b.textContent='Delete?'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('r'); b.classList.add('l'); b.textContent='🗑'; } },3000); return; }
    exWrite(exAll().filter(r=>r.id!==b.dataset.del)); tpList();
  });
}
function tpCsv(rows){
  const head=['Date','Time','Grade','Name','Class','Mark','Out of','Percent','Minutes','Status','Details'];
  const q=v=>{ v=String(v==null?'':v); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[head.join(',')].concat(rows.map(r=>{ const x=exRow(r); return [x.date,x.time,x.grade,x.name,x.cls,x.score,x.max,x.pct,x.minutes,x.status,x.details].map(q).join(','); }));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ICT quiz results ${tpFilter.grade==='all'?'all grades':'grade '+tpFilter.grade} ${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const SHEET_CODE = `function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  var d = JSON.parse(e.postData.contents);
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['Date','Time','Grade','Name','Class','Mark','Out of',
                     'Percent','Minutes','Status','Details','ID']);
  }
  sheet.appendRow([d.date, d.time, d.grade, d.name, d.cls, d.score, d.max,
                   d.pct, d.minutes, d.status, d.details, d.id]);
  return ContentService.createTextOutput('ok');
}`;
function tpSettings(){
  const s=exSettings(), B=TP.querySelector('#tpB');
  B.innerHTML=`<div class="tp-set">
    <div><button class="tp-btn l" id="tpBack">‹ Back to results</button></div>
    <div class="tp-sec"><h3>Google Sheet (collect marks from all computers)</h3>
      <p class="tp-note" style="margin:0 0 6px">Optional. Without it, marks stay on each computer and you export them from here. With it, every finished quiz is also added to one Google Sheet.</p>
      <ol>
        <li>Open a new Google Sheet. Click <b>Extensions › Apps Script</b>.</li>
        <li>Delete what is there and paste this code. Click <b>Save</b>.</li>
      </ol>
      <pre id="tpCode">${exEsc(SHEET_CODE)}</pre>
      <button class="tp-btn l" id="tpCopy">Copy the code</button>
      <ol start="3">
        <li>Click <b>Deploy › New deployment</b>. Type: <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Click <b>Deploy</b> and allow access.</li>
        <li>Copy the <b>Web app URL</b> (it ends with <b>/exec</b>) and paste it here. Do this once on every computer, or ask Claude to put the link inside the quiz files.</li>
      </ol>
      <input type="url" id="tpUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${exEsc(s.sheet)}">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tp-btn g" id="tpSaveUrl">Save link</button><button class="tp-btn l" id="tpTest">Send a test row</button><span class="tp-note" id="tpUrlMsg"></span></div>
    </div>
    <div class="tp-sec"><h3>Change the teacher PIN</h3>
      <input type="password" inputmode="numeric" id="tpNew" placeholder="New PIN (4 or more numbers)" autocomplete="off">
      <button class="tp-btn" id="tpPinSave">Save new PIN</button> <span class="tp-note" id="tpPinMsg"></span></div>
    <div class="tp-sec"><h3>Delete all results on this computer</h3>
      <p class="tp-note" style="margin:0 0 8px">Export to Excel first. This cannot be undone.</p>
      <button class="tp-btn r" id="tpWipe">Delete all results</button></div>
  </div>`;
  B.querySelector('#tpBack').onclick=tpList;
  B.querySelector('#tpCopy').onclick=e=>{ try{ navigator.clipboard.writeText(SHEET_CODE); e.target.textContent='Copied ✓'; }catch(_){ e.target.textContent='Select the code and copy it'; } };
  const msg=B.querySelector('#tpUrlMsg');
  B.querySelector('#tpSaveUrl').onclick=()=>{ const v=B.querySelector('#tpUrl').value.trim(); if(v && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ msg.textContent='The link must start with https://script.google.com and end with /exec'; return; } s.sheet=v; exSetSettings(s); msg.textContent=v?'Saved ✓':'Removed'; };
  B.querySelector('#tpTest').onclick=()=>{ const v=B.querySelector('#tpUrl').value.trim(); if(!v){ msg.textContent='Paste the link first.'; return; }
    fetch(v,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({date:new Date().toLocaleDateString('en-GB'),time:'',grade:EXAM.grade,name:'TEST ROW',cls:'',score:0,max:0,pct:0,minutes:0,status:'test',details:'You can delete this row.',id:'test'})})
      .then(()=>msg.textContent='Sent. Look in your Google Sheet for a TEST ROW.').catch(()=>msg.textContent='Could not send. Check the internet and the link.'); };
  B.querySelector('#tpPinSave').onclick=()=>{ const v=B.querySelector('#tpNew').value.trim(), m=B.querySelector('#tpPinMsg'); if(!/^\d{4,}$/.test(v)){ m.textContent='Use 4 or more numbers.'; return; } s.pin=v; exSetSettings(s); m.textContent='Saved ✓'; };
  const w=B.querySelector('#tpWipe'); w.onclick=()=>{ if(!w.dataset.sure){ w.dataset.sure=1; w.textContent='Tap again to delete everything'; return; } exWrite([]); tpList(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && TP) teacherClose(); });

/* go */
exWelcome();

</script>
